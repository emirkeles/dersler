      /* Renkler (frame.md): kâğıt #f4f1f7, nokta #b9b2c6, siyah #1b1720, pembe #e0347f, açık pembe #f8c6dc,
         uzak yüzey #ddd7e7, beyaz #fff, vurgu sarı #ffd93b; yalnızca panoda: sahne ışığı #fce6f0, sarışın saç #f1d9a6. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f4f1f7;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Plex Sans", sans-serif;
      }
      #sahne text {
        font-family: "Plex Sans", sans-serif;
      }
      #sahne {
        position: absolute;
        inset: 0;
      }
      #dunya,
      #ust {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      /* c: kontur. ck: çıkartma (beyaz kesim payı ve sert gölge). */
      .c {
        stroke: #1b1720;
        stroke-width: 6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .ck {
        filter: url(#cikartma);
      }
      .fk { fill: #1b1720; }
      .fp { fill: #e0347f; }
      .fa { fill: #f8c6dc; }
      .fg { fill: #ddd7e7; }
      .fb { fill: #ffffff; }
      /* Keçeli kalem çizgisi; pathLength = 1 ile baştan sona çizilir. */
      .kalem {
        fill: none;
        stroke: #1b1720;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
      }
      #kapanis {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #perde {
        position: absolute;
        inset: 0;
        background: rgba(27, 23, 32, 0.86);
      }
      #kart {
        position: relative;
        width: 1380px;
        padding: 92px 110px 84px;
        border: 8px solid #1b1720;
        border-radius: 30px;
        background: #ffffff;
        box-shadow: 18px 18px 0 #ffd93b;
        color: #1b1720;
      }
      #cumle {
        font-size: 80px;
        font-weight: 600;
        line-height: 1.16;
        letter-spacing: -0.01em;
      }
      .satir {
        display: block;
        width: 100%;
      }
      #cizgi {
        width: 100%;
        height: 4px;
        margin: 50px 0 44px;
        border-radius: 2px;
        background: #1b1720;
        opacity: 0.35;
        transform-origin: 0 50%;
      }
      #simgeler {
        display: flex;
        align-items: center;
        gap: 90px;
      }
      #simgeler svg {
        display: block;
        width: 300px;
        height: 110px;
      }
    </style>
  </head>

    <script>
      /* Yazı tipi yüklenince kurulur: logonun harfleri ölçülen genişliğe göre dizilir. */
      const kur = () => {
        const NS = "http://www.w3.org/2000/svg";
        const al = (id) => document.getElementById(id);
        const ekle = (ust, ad, oz) => {
          const e = document.createElementNS(NS, ad);
          for (const k in oz) e.setAttribute(k, oz[k]);
          ust.appendChild(e);
          return e;
        };
        const KOYU = "#1b1720", PEMBE = "#e0347f", TEN = "#f8c6dc", BEYAZ = "#ffffff", SARISIN = "#f1d9a6", GRI = "#ddd7e7";

        /* Grubun logosu: düz büyük harfler; C ve N aynalı, A çizgisiz (ters çevrilmiş V). Resmî çizim değil,
           elimizdeki yazı tipiyle yaklaşık dizgi. (cx, y): ortası ve taban çizgisi; s: yazı boyu. Genişliği döner. */
        const logoYaz = (g, cx, y, s, renk) => {
          const HARF = [["B"], ["L"], ["V", "ters"], ["C", "ayna"], ["K"], ["P"], ["I"], ["N", "ayna"], ["K"]];
          const ARA = s * 0.04, BUYUK = s * 0.698;
          const ts = HARF.map(([h]) => {
            /* Harfler bilerek bitişik dizilir (tek sözcük) ve kapanış kartı logonun üstüne gelir; yerleşim denetimi
               bunları üst üste yazı ya da örtülmüş yazı saymasın. */
            const t = ekle(g, "text", { x: 0, y, "font-size": s, "font-weight": 700, fill: renk, "data-layout-allow-overlap": "", "data-layout-allow-occlusion": "" });
            t.textContent = h;
            return t;
          });
          const w = ts.map((t) => t.getComputedTextLength());
          const W = w.reduce((a, b) => a + b, 0) + ARA * (HARF.length - 1);
          let x = cx - W / 2;
          ts.forEach((t, i) => {
            const xc = x + w[i] / 2;
            t.setAttribute("x", x.toFixed(2));
            if (HARF[i][1] === "ayna") t.setAttribute("transform", `matrix(-1 0 0 1 ${(2 * xc).toFixed(2)} 0)`);
            if (HARF[i][1] === "ters") t.setAttribute("transform", `rotate(180 ${xc.toFixed(2)} ${(y - BUYUK / 2).toFixed(2)})`);
            x += w[i] + ARA;
          });
          return W;
        };
        const LW = logoYaz(al("logo-yazi"), 670, 169, 54, PEMBE);
        al("logo-zemin").setAttribute("x", (670 - LW / 2 - 30).toFixed(1));
        al("logo-zemin").setAttribute("width", (LW + 60).toFixed(1));
        logoYaz(al("pano-logo"), 1568, 196, 38, PEMBE);
        logoYaz(al("afis-logo"), 2570, 196, 34, PEMBE);
        logoYaz(al("salon-logo"), 5080, 302, 92, PEMBE);

        /* Yüzsüz, şematik bir kişi; ayak ortası (x, y). sac: renk; uzun: saçın indiği yükseklik (yoksa kısa);
           on: "ayrik" | "kakul"; kuyruk: at kuyruğu; ust, alt: renk; altTur: "etek" | "sort"; duz: düz siyah
           ayakkabı (yoksa reklamdaki); bilet: elinde bilet. Dış grup hareket ettirilir, iç grup yerleşimi tutar. */
        const KOL = {
          yukariSag: "M 17 -164 L 36 -184 L 33 -214", yukariSol: "M -17 -164 L -36 -184 L -33 -214",
          belSol: "M -17 -164 L -36 -144 L -21 -128", belSag: "M 17 -164 L 36 -144 L 21 -128",
          asagiSag: "M 18 -164 L 25 -122", asagiSol: "M -18 -164 L -25 -122",
        };
        const uye = (ust, x, y, o, olcek = 1, oz = {}) => {
          const c = `stroke="${KOYU}" stroke-width="${o.kalin || 4.5}" stroke-linejoin="round" stroke-linecap="round"`;
          let h = "";
          if (o.uzun) h += `<path ${c} fill="${o.sac}" d="M -21 -204 Q -32 -160 -26 ${-o.uzun} ${o.dalga ? "q 9 9 17 0 q 9 9 18 0 q 9 9 17 0" : `L 26 ${-o.uzun}`} Q 32 -160 21 -204 Z" />`;
          if (o.kuyruk) h += `<path ${c} fill="${o.sac}" d="M 8 -214 C 44 -228 50 -176 34 -142 C 32 -172 24 -190 8 -196 Z" />`;
          h += `<rect ${c} fill="${TEN}" x="-18" y="-92" width="15" height="80" rx="7" /><rect ${c} fill="${TEN}" x="3" y="-92" width="15" height="80" rx="7" />`;
          h += o.altTur === "sort"
            ? `<rect ${c} fill="${o.alt}" x="-21" y="-126" width="42" height="32" rx="6" />`
            : `<path ${c} fill="${o.alt}" d="M -26 -82 L 26 -82 L 19 -126 L -19 -126 Z" />`;
          h += `<rect ${c} fill="${TEN}" x="-5" y="-184" width="10" height="14" />`;
          h += `<rect ${c} fill="${o.ust}" x="-20" y="-174" width="40" height="54" rx="11" />`;
          for (const k of o.kollar) {
            h += `<path fill="none" stroke="${KOYU}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" d="${KOL[k]}" /><path fill="none" stroke="${TEN}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="${KOL[k]}" />`;
            if (k === "yukariSag") h += `<circle cx="33" cy="-224" r="7" fill="${KOYU}" />`;
            if (k === "yukariSol") h += `<circle cx="-33" cy="-224" r="7" fill="${KOYU}" />`;
          }
          h += `<circle ${c} fill="${TEN}" cx="0" cy="-200" r="19" />`;
          h += o.on === "kakul"
            ? `<path ${c} fill="${o.sac}" d="M -18.3 -205 A 19 19 0 0 1 18.3 -205 Z" />`
            : `<path ${c} fill="${o.sac}" d="M -18 -194 A 19 19 0 0 1 18 -194 C 16 -206 8 -212 0 -216 C -8 -212 -16 -206 -18 -194 Z" />`;
          h += o.duz
            ? `<path fill="${KOYU}" d="M -22 0 v -9 q 0 -7 8 -7 h 9 q 10 2 12 10 v 6 Z" /><path fill="${KOYU}" d="M -1 0 v -9 q 0 -7 8 -7 h 9 q 10 2 12 10 v 6 Z" />`
            : `<use href="#ayakkabi" x="-36" y="-21" width="38" height="21.3" /><use href="#ayakkabi" x="0" y="-21" width="38" height="21.3" />`;
          if (o.bilet) h += `<use href="#bilet" x="12" y="-142" width="46" height="26" />`;
          const dis = ekle(ust, "g", oz);
          ekle(dis, "g", { transform: `translate(${x} ${y}) scale(${olcek})` }).innerHTML = h;
          return dis;
        };
        /* Grubun dört üyesi: saçla ayrışırlar. Panoda, odadaki afişte ve salonun afişinde aynı çizim. */
        const GRUP = [
          { sac: KOYU, uzun: 120, on: "ayrik", ust: PEMBE, alt: PEMBE, kollar: ["asagiSol", "belSag"] },
          { sac: KOYU, kuyruk: true, on: "ayrik", ust: KOYU, alt: BEYAZ, kollar: ["yukariSol", "asagiSag"] },
          { sac: SARISIN, uzun: 124, dalga: true, on: "ayrik", ust: KOYU, alt: KOYU, kollar: ["asagiSol", "belSag"] },
          { sac: KOYU, uzun: 112, on: "kakul", ust: BEYAZ, alt: KOYU, altTur: "sort", kollar: ["asagiSol", "yukariSag"] },
        ];
        const grup = (ust, cx, y, aralik, olcek) => GRUP.forEach((o, i) => uye(ust, cx + (i - 1.5) * aralik, y, o, olcek));
        grup(al("yildiz-kisi"), 1224, 486, 84, 1);
        grup(al("afis-uyeler"), 2570, 404, 52, 0.58);
        grup(al("salon-afis"), 5415, 638, 52, 0.6);
        /* Sıradaki iki kişi (kurgu): ellerinde bilet. */
        uye(al("sira"), 4800, 694, { sac: KOYU, kuyruk: true, on: "ayrik", ust: GRI, alt: KOYU, kollar: ["asagiSol", "asagiSag"], duz: true, bilet: true, kalin: 3.5 }, 1.7, { id: "kisi-a", class: "ck" });
        uye(al("sira"), 4630, 694, { sac: KOYU, uzun: 112, on: "kakul", ust: BEYAZ, alt: PEMBE, altTur: "sort", kollar: ["asagiSol", "asagiSag"], duz: true, bilet: true, kalin: 3.5 }, 1.7, { id: "kisi-b", class: "ck" });

        /* Azra'nın öteki bölgelerdeki kopyaları (kimliklere sonek eklenir) ve ayağındaki reklam ayakkabısı. */
        const azraKopya = (sonek, ust, cikartma = true) => {
