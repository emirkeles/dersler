      <!-- Kâğıt dişi: bütün resmin üstünde, çarpılarak. -->
      <svg data-hf-id="hf-ca7t" id="dis-kat" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="mix-blend-mode: multiply">
        <rect data-hf-id="hf-53so" width="1920" height="1080" filter="url(#dis)" />
      </svg>
    </div>
    <script>
      /* Yazı tipi yüklenince kurulur: bazı etiketler ölçülen yazı genişliğine göre yerleşir. */
      const kur = () => {
        const NS = "http://www.w3.org/2000/svg";
        const ekle = (ust, ad, oz) => {
          const e = document.createElementNS(NS, ad);
          for (const k in oz) e.setAttribute(k, oz[k]);
          ust.appendChild(e);
          return e;
        };
        const al = (id) => document.getElementById(id);
        const KOYU = "#191c45", MAVI = "#3560c4", MERCAN = "#d8334a";

        /* Gök taraması: y = 250'de noktalar birbirine değer (düz mavi), ufka doğru küçülür. Rastgele yok. */
        (() => {
          const ADIM = 22, UST = 250, ALT = 610;
          let d = "";
          for (let sira = 0, y = UST; y <= ALT; sira++, y += ADIM / 2) {
            const t = (y - UST) / (ALT - UST);
            const r = 15.8 * Math.pow(1 - t, 1.15);
            if (r < 0.9) break;
            for (let x = -960 + (sira % 2 ? ADIM / 2 : 0); x <= 2880; x += ADIM) {
              d += `M${x - r},${y}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0`;
            }
          }
          ekle(al("gok-nokta"), "path", { d: d.replace(/(\.\d\d)\d+/g, "$1") });
        })();

        /* Basamak satırı (dersteki "basamak" ile aynı davranış). Rakamlar X(i)'de durur; virgül VX(k)'ye,
           yani k rakamın sağına kayar; üs = 1 − k olur. Sayaç, üst üste duran yazıların sırayla açılmasıdır. */
        const DX = 92, BOS = 34, SY = 836;
        const grup = (i) => (i === 0 ? 0 : Math.floor((i - 1) / 3));
        const satir = (ad, rakam, x0) => {
          const g = al(ad), n = rakam.length;
          const X = (i) => x0 + i * DX + grup(i) * BOS;
          const VX = (k) => (k >= n ? X(n - 1) + DX / 2 : (X(k - 1) + X(k)) / 2);
          const yazi = (id, x, metin, oz = {}) => {
            const t = ekle(g, "text", { id: `${ad}-${id}`, x, y: SY, "font-size": 96, "font-weight": 700, fill: KOYU, "text-anchor": "middle", opacity: 0, ...oz });
            t.textContent = metin;
            return t;
          };
          const iz = ekle(g, "g", { id: `${ad}-iz` });
          for (let k = 2; k <= n; k++) {
            const a = VX(k - 1), b = VX(k), yb = SY + 34;
            ekle(iz, "path", { id: `${ad}-iz${k}`, d: `M${a},${yb} Q${(a + b) / 2},${yb + 30} ${b},${yb}`, fill: "none", stroke: MAVI, "stroke-width": 5, "stroke-linecap": "round", opacity: 0 });
          }
          for (let i = 1; i < n - 1; i++) ekle(g, "circle", { id: `${ad}-n${i}`, cx: X(i), cy: SY + 62, r: 7, fill: KOYU, opacity: 0 });
          [...rakam].forEach((ch, i) => yazi(`r${i}`, X(i), ch));
          /* Virgül çizimdir (yazı değil): rakamların arasından geçerken üstlerine binmez. */
          const v = ekle(g, "g", { id: `${ad}-v`, transform: `translate(${VX(1)} ${SY})`, opacity: 0 });
          ekle(v, "circle", { cx: 0, cy: -8, r: 8.5, fill: MERCAN });
          ekle(v, "path", { d: "M 3 -6 L -6 17", fill: "none", stroke: MERCAN, "stroke-width": 8.5, "stroke-linecap": "round" });
          const ux = X(n - 1) + DX / 2 + 48;
          const us = ekle(g, "g", { id: `${ad}-us`, opacity: 0 });
          const carpi = ekle(us, "text", { x: ux, y: SY, "font-size": 96, "font-weight": 700, fill: KOYU });
          carpi.textContent = "× 10";
          const cw = carpi.getComputedTextLength();
          for (let j = 0; j < n; j++) {
            const t = ekle(us, "text", { id: `${ad}-u${j}`, x: ux + cw + 6, y: SY - 40, "font-size": 62, "font-weight": 700, fill: MERCAN, opacity: j ? 0 : 1 });
            t.textContent = j ? `−${j}` : "0";
          }
          yazi("m", ux + 34, "m");
          return { ad, n, X, VX, mKayma: cw + 118 };
        };
        const A = satir("satir-a", "0000000003", 330);
        const B = satir("satir-b", "000007", 520);

        /* Kıyas satırları: üs ve birim, gövdenin ölçülen genişliğine göre yerleşir. */
        for (const k of ["k1", "k2"]) {
          const w = al(`${k}-govde`).getComputedTextLength();
          al(`${k}-us`).setAttribute("x", 720 + w + 6);

        }

        /* ---- Kamera ve derinlik: tek durum nesnesi. Görüntü her an yalnızca bu değerlerden hesaplanır. ----
           z: dünyanın büyütmesi (log10). (px, py) dünyadaki nokta, ekranda (qx, qy)'ye gelir.
           d: saç telinin içine derinlik. d = 0'da 200 px = 10⁻⁵ m; her 1 artışta görüntü 10 kat büyür.
           Dünyadaki tel 3,5 px, tel düzlemindeki 1400 px olduğundan d = z − log10(400).
           bw: 3 nm işaretlerinin dizildiği bandın yarı genişliği (px). */
        const Z_TEL = Math.log10(400);
        const st = { px: 1190, py: 620, qx: 1190, qy: 620, z: 0, d: -2.9, bw: 0 };
        const kam = al("kam"), duz = [0, 1, 2, 3, 4].map((k) => al(`duz-${k}`));
        const bantDesen = al("bant-desen"), bantDuz = al("bant-duz"), desen = al("tr-isaret");
        const olcekUs = al("olcek-us"), sayacYazi = al("sayac-yazi");
        const rampa = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a)));
        const bin = (n) => String(n).replace(/\B(?=(\d{3})+$)/g, " ");
        const ciz = () => {
          const d = st.d;
          /* Dünya: tel düzlemi tümüyle açılınca gizlenir. */
          const dunyaGorunur = d < -0.52;
          kam.style.display = dunyaGorunur ? "" : "none";
          if (dunyaGorunur) {
            const S = Math.min(Math.pow(10, st.z), 125);
            kam.setAttribute("transform", `translate(${st.qx - S * st.px} ${st.qy - S * st.py}) scale(${S})`);
          }
          /* Düzlemler: k. düzlem d = k'de bire birdir; bir sonraki tümüyle açılınca gizlenir. */
          duz.forEach((g, k) => {
            const op = k === 0 ? rampa(d, -0.92, -0.52) : rampa(d, k - 0.65, k - 0.25);
            const gorunur = op > 0 && (k === 4 || d < k + 0.75);
            g.style.display = gorunur ? "" : "none";
            if (!gorunur) return;
            const s = Math.pow(10, d - k);
            g.setAttribute("opacity", op);
            g.setAttribute("transform", `translate(960 540) scale(${s}) translate(-960 -540)`);
          });
          /* Ölçek etiketi: 200 px = 10^(−5 − d) m. */

          /* 3 nm işaretleri: bir işaret 600 · 10^(d − 4) px. Bant telin dışına taşmaz. */

          for (const r of [bantDesen, bantDuz]) {
            r.setAttribute("x", 960 - w);
            r.setAttribute("width", Math.max(0.01, 2 * w));
          }
          desen.setAttribute("patternTransform", `translate(${960 - per / 2} 494) scale(${per / 600} 1)`);
          bantDuz.setAttribute("opacity", 1 - rampa(per, 20, 60));
          sayacYazi.textContent = bin(Math.min(23333, Math.max(1, Math.round((2 * w) / per))));
        };

        const tl = gsap.timeline({ paused: true });
        const simdi = { ...st };
        const git = (t, sure, hedef, ease = "power2.inOut") => {
          const bas = {};
          for (const k in hedef) bas[k] = simdi[k];
          tl.fromTo(st, bas, { ...hedef, duration: sure, ease, immediateRender: false, onUpdate: ciz }, t);
          Object.assign(simdi, hedef);
        };
        const gir = (hedef, t, sure = 0.45, oz = {}) => tl.fromTo(hedef, { opacity: 0, ...(oz.bas || {}) }, { opacity: 1, duration: sure, ease: oz.ease || "power3.out", ...(oz.son || {}) }, t);
        const cik = (hedef, t, sure = 0.35) => tl.fromTo(hedef, { opacity: 1 }, { opacity: 0, duration: sure, ease: "power2.in", immediateRender: false }, t);

        /* Zaman: karelerin başlangıçları (sn). Kliplerin gerçek sürelerinden çıkarıldı (assets/ses-esit/olcum.json);
           klipler kare başlangıcından 0,2–0,8 sn sonra girer (<audio> öğeleri). Karelerin içindeki işaret anları
           kliplerdeki duraklamalara göre yerleştirildi; klipler yeniden üretilirse bu tablo ve o anlar değişir. */
        const T = { l1: 0, l2: 8.9, l3: 13.2, l4: 23.3, l5: 31.5, l6: 39.5, l7: 46.3, l8: 52.2, l9: 59.0, l10: 67.6, son: 73.5 };

        /* Virgülün k − 1'den k'ye kayışı: küçük bir yay, altında iz, sayaç bir değişir, geride kalan sıfır solar. */
        const kay = (R, k, t, sure) => {

        const satirAc = (R, t0, tSifir, aralik, tSon) => {

          tl.fromTo(son, { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.1, duration: 0.28, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, tVurgu);
        };

        /* ---- Kare 1 — durak. Baskı sırası: mavi, koyu, sarı (kayık gelir, yerine oturur), en son mercan. ---- */
        tl.fromTo(".m", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out", stagger: 0.03 }, T.l1 + 0.1);
        tl.fromTo(".k", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.02 }, T.l1 + 0.55);
        tl.fromTo(".s", { opacity: 0, x: 26, y: -20 }, { opacity: 1, x: 5, y: -4, duration: 0.8, ease: "power3.out", stagger: 0.04 }, T.l1 + 1.0);
        tl.fromTo("#pano-yazi", { opacity: 0, scale: 0.6, svgOrigin: "1190 736" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, T.l1 + 7.3);
        /* Rüzgâr: saç telleri ve yapraklar; her hareket sonlu. */
        const RUZGAR = T.l1 + 1.4;
        tl.fromTo("#tel-1", { rotation: -2, svgOrigin: "720 496" }, { rotation: 3, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, RUZGAR);

        tl.fromTo("#tel-3", { rotation: -3, svgOrigin: "706 472" }, { rotation: 2.5, duration: 1.45, ease: "sine.inOut", yoyo: true, repeat: 4 }, RUZGAR);
        tl.fromTo("#yaprak-1", { x: -70, y: 14, rotation: -30, svgOrigin: "880 640" }, { x: 0, y: 0, rotation: 0, duration: 7.0, ease: "sine.out" }, RUZGAR);

        tl.fromTo("#bulut-1", { x: -24 }, { x: 10, duration: T.l2, ease: "none" }, 0);

        git(T.l1, T.l2 - T.l1, { z: Math.log10(1.05) }, "none");

        git(T.l5 + 0.2, 1.2, { px: 1066, py: 470, qx: 960, qy: 540, z: Math.log10(2) }, "power3.inOut");
        cik("#tel-3", T.l5 + 0.7, 0.2);
        tl.fromTo("#ucan-tel", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, T.l5 + 0.8);
        tl.fromTo("#ucan-tel", { x: -330, rotation: -74, svgOrigin: "1066 470" }, { x: 0, rotation: 0, duration: 1.7, ease: "power2.out", immediateRender: false }, T.l5 + 0.8);
        tl.fromTo("#ucan-tel", { y: -30 }, { y: -74, duration: 0.8, ease: "sine.out", immediateRender: false }, T.l5 + 0.8);
        tl.fromTo("#ucan-tel", { y: -74 }, { y: 0, duration: 0.9, ease: "sine.inOut", immediateRender: false }, T.l5 + 1.6);
        simdi.d = Math.log10(2) - Z_TEL;
        git(T.l5 + 2.6, 2.3, { z: Z_TEL, d: 0 }, "power2.inOut");
        tl.fromTo("#olcek", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.l5 + 4.9);
        gir("#olcu-cizgi", T.l5 + 5.0, 0.2);
        tl.fromTo("#olcu-cizgi-ic", { scaleX: 0, svgOrigin: "260 300" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, T.l5 + 5.0);
        tl.fromTo("#serit", { y: 520 }, { y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, T.l5 + 5.0);
        satirAc(B, T.l5 + 5.7, T.l5 + 6.0, 0.13, T.l5 + 6.9);

        /* ---- Kare 6 — virgül beş basamak: aynı hareket, daha kısa. ---- */
        satirKay(B, T.l6 + 0.1, T.l6 + 1.1, 0.6, T.l6 + 1.9, 0.42, 0.34, T.l6 + 3.8);

        /* ---- Kare 7 — iki üs: gösterimler alt alta, üsler sırayla büyür, arada dört basamak. ---- */
        cik("#satir-b", T.l7, 0.35);
        cik("#cip-a", T.l7 + 0.1, 0.35);
        tl.fromTo("#kiyas-1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, T.l7 + 0.3);
        tl.fromTo("#kiyas-2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, T.l7 + 0.6);
        tl.fromTo("#k1-us", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.4, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, T.l7 + 1.7);
        tl.fromTo("#k2-us", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.4, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, T.l7 + 2.6);
        gir("#kiyas-ok", T.l7 + 3.5, 0.4);
        /* Pipler: şeritteki yerleri (PSX, PSY), ölçek etiketinin altındaki yerleri (PCX, PCY). */
        const PSX = (i) => 1450 + i * 72, PSY = 808, PCX = (i) => 909 + i * 34, PCY = 204;
        for (let i = 0; i < 4; i++) {
          tl.fromTo(`#pip-${i}`, { opacity: 0, x: PSX(i), y: PSY, scale: 0 }, { opacity: 1, x: PSX(i), y: PSY, scale: 1.7, duration: 0.35, ease: "back.out(2.2)" }, T.l7 + 3.9 + i * 0.3);
        }

        /* ---- Kare 8 — dört yakınlaşma: her adım tam 10 kat; bir pip dolar, etiket bir basamak değişir. ---- */
        cik("#kiyas-1", T.l8, 0.35);

        cik("#kiyas-ok", T.l8, 0.35);
        tl.fromTo("#serit", { y: 0 }, { y: 520, duration: 0.6, ease: "power3.in", immediateRender: false }, T.l8 + 0.15);
        for (let i = 0; i < 4; i++) {
          tl.fromTo(`#pip-${i}`, { x: PSX(i), y: PSY, scale: 1.7 }, { x: PCX(i), y: PCY, scale: 1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, T.l8 + 0.1 + i * 0.04);
          const ts = T.l8 + 2.3 + i * 1.1;
          git(ts, 0.85, { d: i + 1 }, "power3.inOut");
          tl.fromTo(`#pip-${i}-d`, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, ts + 0.4);
          tl.fromTo(`#pip-${i}`, { scale: 1 }, { scale: 1.5, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, ts + 0.4);
          tl.fromTo("#on-kat", { opacity: 0, scale: 0.7, svgOrigin: "1221 100" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, ts + 0.05);
          tl.fromTo("#on-kat", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none", immediateRender: false }, ts + 0.75);
        }

        /* ---- Kare 9 — yan yana: 3 nm işareti görünür; kamera geri çekilirken işaretler dizilir ve sayılır. ---- */
        cik("#pipler", T.l9, 0.3);
        gir("#bant", T.l9 + 0.2, 0.15);
        git(T.l9 + 0.2, 0.7, { bw: 300 }, "power3.out");
        tl.fromTo("#isaret-yazi", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.l9 + 0.7);
        cik("#isaret-yazi-kap", T.l9 + 3.0, 0.3);
        tl.fromTo("#sayac", { opacity: 0, scale: 0.7, svgOrigin: "960 416" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, T.l9 + 3.3);
        git(T.l9 + 3.1, 0.8, { bw: 1000 }, "power2.inOut");
        git(T.l9 + 3.9, 3.4, { d: 0 }, "power2.inOut");
        tl.set("#sayac-yazi", { opacity: 0 }, T.l9 + 7.4);
        tl.set("#sayac-son", { opacity: 1 }, T.l9 + 7.4);
        tl.fromTo("#sayac", { scale: 1 }, { scale: 1.12, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.l9 + 7.4);

        /* ---- Kare 10 — kapanış: perde iner, kart gelir, cümle iki parça hâlinde okunur. ---- */
        cik("#ust", T.l10 + 0.1, 0.5);
        tl.fromTo("#perde", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, T.l10 + 0.1);
        tl.fromTo("#kart", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, T.l10 + 0.3);
        tl.fromTo("#c1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T.l10 + 0.7);
        tl.fromTo("#c2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T.l10 + 2.3);
        tl.fromTo("#cizgi", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, T.l10 + 3.2);
        tl.fromTo("#model", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, T.l10 + 3.4);

        ciz();
        window.__timelines["main"] = tl;
        tl.seek(0);
      };
      Promise.all([document.fonts.load('700 96px "Plex Sans"', "0123456789× −m"), document.fonts.ready]).then(kur, kur);
