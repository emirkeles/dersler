      /* Renkler: frame.md. */

    <script>
      const kur = () => {
        const R = { gece: "#14112b", koyuMor: "#211b4a", mor: "#7e69d2", krem: "#f4eedf", turuncu: "#ff7a3d", nane: "#4fd8b4", altin: "#ffc94a" };
        const W = 1920, H = 1080;
        const kis = (x, a, b) => Math.min(b, Math.max(a, x));
        const rampa = (x, a, b) => kis((x - a) / (b - a), 0, 1);
        const kar = (a, b, t) => a + (b - a) * t;
        const yay = (t) => { const c = 1.9; const u = kis(t, 0, 1) - 1; return 1 + (c + 1) * u * u * u + c * u * u; }; /* back.out */
        /* Tohumlu sayı üreteci: yıldızlar, flaşlar ve kâğıt dişi her karede aynı çıkar. */
        const tohum = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

        /* ---- Kâğıt dişi: bir kez çizilir, durağandır. ---- */
        (() => {
          const c = document.getElementById("doku").getContext("2d");
          const r = tohum(7);
          const im = c.createImageData(W, H);
          for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - 0.5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
          c.putImageData(im, 0, 0);
        })();

        /* ---- Stadyum ---- */
        const PY = 520, KH = 60, FX = 1420; /* pistin üstü, kulvar yüksekliği, bitiş çizgisinin yakın kenarı */
        const kam = document.getElementById("kam");
        const r1 = tohum(11);
        let h = "";
        h += `<g id="yildizlar">`;
        for (let i = 0; i < 90; i++) h += `<circle cx="${(-400 + r1() * 2700).toFixed(0)}" cy="${(-1500 + r1() * 1560).toFixed(0)}" r="${(1.6 + r1() * 2.6).toFixed(1)}" fill="${R.krem}" opacity="${(0.25 + r1() * 0.6).toFixed(2)}"></circle>`;
        h += `</g>`;
        /* tabela: tribünün üstünde, iki direkte */
        h += `<g id="tabela"><rect x="622" y="-170" width="30" height="300" fill="#2c2560"></rect><rect x="1268" y="-170" width="30" height="300" fill="#2c2560"></rect>`;
        h += `<g transform="translate(480 -580)"><rect x="0" y="0" width="960" height="420" rx="26" fill="${R.koyuMor}"></rect><rect x="16" y="16" width="928" height="388" rx="16" fill="#0e0b20" stroke="${R.krem}" stroke-opacity="0.9" stroke-width="5"></rect><g id="satirlar"></g>`;
        h += `<g id="kimin"><circle cx="874" cy="210" r="44" fill="none" stroke="${R.altin}" stroke-width="7" stroke-dasharray="14 10"></circle><text data-layout-allow-occlusion data-layout-allow-overflow x="874" y="231" text-anchor="middle" font-size="58" font-weight="700" fill="${R.altin}">?</text></g></g></g>`;
        /* projektör direkleri ve ışık konileri */
        const direk = (x, yon) => {
          let s = `<rect x="${x - 11}" y="100" width="22" height="380" fill="#2c2560"></rect><rect x="${x - 128}" y="14" width="256" height="96" rx="14" fill="#2c2560"></rect>`;
          for (let j = 0; j < 3; j++) for (let i = 0; i < 6; i++) s += `<circle class="lamba" cx="${x - 100 + i * 40}" cy="${34 + j * 28}" r="10" fill="${R.krem}"></circle>`;
          s += `<polygon class="koni" points="${x - 118},110 ${x + 118},110 ${x + 118 + yon * 560 + 360},1000 ${x - 118 + yon * 560 - 360},1000" fill="${R.krem}"></polygon>`;
          return s;
        };
        h += `<g id="tribun"><rect x="-700" y="120" width="3400" height="352" fill="${R.koyuMor}"></rect><rect x="-700" y="150" width="3400" height="316" fill="url(#seyirci)"></rect>`;
        h += `<rect x="-700" y="120" width="3400" height="28" fill="#2c2560"></rect><rect x="-700" y="252" width="3400" height="5" fill="${R.gece}"></rect><rect x="-700" y="362" width="3400" height="5" fill="${R.gece}"></rect>`;
        const r2 = tohum(23);
        for (let i = 0; i < 16; i++) h += `<circle class="cakar" cx="${(700 + r2() * 1100).toFixed(0)}" cy="${(170 + r2() * 280).toFixed(0)}" r="9" fill="${R.krem}"></circle>`;
        h += `</g>`;
        h += `<g id="isiklar">${direk(150, 1)}${direk(1770, -1)}</g>`;
        h += `<g id="pist"><rect x="-700" y="470" width="3400" height="50" fill="#2a2157"></rect><rect x="-700" y="470" width="3400" height="50" fill="url(#reklam)"></rect>`;
        h += `<rect id="pist-zemin" x="-700" y="${PY}" width="3400" height="${8 * KH}" fill="${R.mor}"></rect><rect x="-700" y="1000" width="3400" height="120" fill="#2b2259"></rect>`;
        for (let i = 0; i <= 8; i++) h += `<rect class="kulvar" x="-700" y="${PY + i * KH - 2}" width="3400" height="4" fill="${R.krem}" opacity="0.92"></rect>`;
        h += `<rect id="bitis" x="${FX}" y="${PY}" width="13" height="${8 * KH}" fill="${R.krem}"></rect>`;
        /* bitiş çizgisinin hizasındaki kamera */
        h += `<g transform="translate(${FX + 6} 474)"><g id="bitis-kamera"><rect x="-4" y="6" width="8" height="40" fill="${R.krem}"></rect><rect x="-24" y="-22" width="48" height="32" rx="7" fill="${R.krem}"></rect><circle cx="0" cy="-6" r="9" fill="${R.gece}"></circle><circle cx="0" cy="-6" r="4" fill="${R.altin}"></circle></g></g>`;
        h += `</g><g id="kosucular"></g><g id="oklar"></g>`;
        kam.innerHTML = h;

        /* ---- Tabela: yedi parçalı rakamlar. Sönük parçalar hep görünür; yanan parçalar ayrı öğedir. ---- */
        const PARCA = { a: [12, 0, 60, 0], b: [70, 10, 0, 60], c: [70, 80, 0, 60], d: [12, 136, 60, 0], e: [0, 80, 0, 60], f: [0, 10, 0, 60], g: [12, 68, 60, 0] };
        const parcaNokta = ([x, y, w, hh]) => (w ? `${x},${y + 7} ${x + 7},${y} ${x + w - 7},${y} ${x + w},${y + 7} ${x + w - 7},${y + 14} ${x + 7},${y + 14}` : `${x + 7},${y} ${x + 14},${y + 7} ${x + 14},${y + hh - 7} ${x + 7},${y + hh} ${x},${y + hh - 7} ${x},${y + 7}`);
        const RAKAM = { 9: "abcdfg", 7: "abc", 8: "abcdefg", 4: "bcfg" };
        const HANE = [250, 400, 510, 620]; /* 9 , 7 9 [üçüncü basamak] */
        let sat = "";
        for (const [ad, y, renk, daire] of [["b", 45, R.nane, false], ["a", 225, R.turuncu, true]]) {
          sat += `<g transform="translate(0 ${y})">`;
          sat += daire ? `<circle id="cip-${ad}" cx="150" cy="75" r="30" fill="${renk}"></circle>` : `<polygon id="cip-${ad}" points="150,38 187,75 150,112 113,75" fill="${renk}"></polygon>`;
          let sonuk = "", isik = "";
          HANE.forEach((x, d) => {
            sonuk += `<g transform="translate(${x} 0) skewX(-5)">`; isik += `<g transform="translate(${x} 0) skewX(-5)">`;
            for (const p in PARCA) { sonuk += `<polygon points="${parcaNokta(PARCA[p])}" fill="#3b3270" opacity="0.5"></polygon>`; isik += `<polygon id="L-${ad}-${d}-${p}" class="led" points="${parcaNokta(PARCA[p])}" fill="${R.altin}"></polygon>`; }
            sonuk += `</g>`; isik += `</g>`;
          });
          isik += `<path id="L-${ad}-v" class="led" d="M346 132 h18 v18 l-9 18 h-9 l6 -18 h-6 z" fill="${R.altin}"></path>`;
          sat += `${sonuk}<g id="isik-${ad}">${isik}</g><text data-layout-allow-occlusion data-layout-allow-overflow x="738" y="148" font-size="60" font-weight="600" fill="${R.krem}" opacity="0.6">sn</text></g>`;
        }
        document.getElementById("satirlar").innerHTML = sat;

        /* ---- Kamera şeridi: sekiz kulvar bandı ---- */
        let ser = "";
        for (let i = 0; i < 8; i++) ser += `<rect x="340" y="${596 + i * 30}" width="1240" height="30" fill="${i % 2 ? "#6f5bc4" : "#7e69d2"}" opacity="0.55"></rect>`;
        document.getElementById("serit").innerHTML = ser;

        /* ---- Koşucular: tek renkli piktogram, koşu döngüsü alınan yoldan hesaplanır. ---- */
        const A = 6, B = 3; /* satırlar: A birinci (turuncu), B ikinci (nane) */
        const SON = [81, 56, 22, 4, 30, 64, 0, 106]; /* bitişte lidere uzaklık (px): 1 px ≈ 1,2 cm; gerçek derecelerle orantılı (9,784 · 9,789 · 9,81 · 9,82 · 9,85 · 9,86 · 9,88 · 9,91) */
