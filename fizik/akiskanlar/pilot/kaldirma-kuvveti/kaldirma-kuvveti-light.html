<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arşimet düzeneği</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.kk-cam>.iso-fill{fill-opacity:.2}
.kk-cam>.iso-shade{fill-opacity:.4}
.kk-cam>.iso-top{fill-opacity:.9}
.kk-cam-ic>.iso-shade{fill-opacity:.55}
.kk-oyuk{fill:var(--kk-oyuk);stroke:none}
.kk-yay{stroke-linejoin:round}
.kk-ibre{stroke-width:1.1}
.kk-akis{stroke-width:1.6;stroke-dasharray:5 3}

.kk-stage{position:relative;border-radius:10px;cursor:ns-resize;touch-action:pan-y;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.kk-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.kk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.kk-stage{--kk-oyuk:#e2e2df}
.iso[data-theme="dark"] .kk-stage{--kk-oyuk:#0b0b0b}
.kk-su{--anatomy-paper:#e6eaec;--anatomy-face:#eaeef0;--anatomy-top:#eef2f3;--anatomy-shade-0:#cbd2d6;--anatomy-shade-1:#d3dadd;--anatomy-shade-2:#dae0e3;--anatomy-shade-3:#e1e6e8;--anatomy-lit-top:#e9edef;--anatomy-lit-shade:#d2d9dc;--anatomy-hi:#4b5257;--anatomy-mid:#8f979c;--anatomy-lo:#aab2b7;--anatomy-faint:#c3cace;--anatomy-lit:#2b3136}

@media (prefers-reduced-motion:reduce){.kk-akis{animation:none}}

// Arşimet düzeneğinin saf modeli. Derleme (build.mjs) ve sayfa (live.js) aynı kodu kullanır:
// içe aktarma yok, DOM yok, zaman yalnızca `adim` içindeki dt ile girer.
// Birimler: uzunluk mm, hacim mm³, kuvvet N, açı derece, süre sn.

const RO_G = 1000 * 9.8 * 1e-9;            // suyun özgül ağırlığı (1000 kg/m³ · 9,8 m/s²), N/mm³

const SILINDIR_R = 20;
const SILINDIR_BOY = 80;
const SILINDIR_ALAN = Math.PI * SILINDIR_R * SILINDIR_R;
const SILINDIR_HACIM = SILINDIR_ALAN * SILINDIR_BOY;
const AGIRLIK = 2700 * 9.8 * 1e-9 * SILINDIR_HACIM;   // alüminyum, 2700 kg/m³

const YAY_K = 0.1;                         // 0–5 N, 50 mm'de tam ölçek
const OLCEK_N = 5;
const OLCEK_MM = OLCEK_N / YAY_K;

const TASIRMA_R = 45;                      // taşırma kabı, iç yarıçap
const TASIRMA_ALAN = Math.PI * TASIRMA_R * TASIRMA_R;
const AGIZ = 120;                          // musluğun kap tabanından yüksekliği

const TOPLAMA_R = 30;                      // toplama kabı, iç yarıçap
const TOPLAMA_ALAN = Math.PI * TOPLAMA_R * TOPLAMA_R;

const TERAZI_TUR = 2;                      // kadranın tam turu, N

// Taşıyıcının indirilme miktarı. 0'da silindirin tabanı dolu kabın yüzeyine değer.
// 130'da silindir kabın tabanına 0,15 mm girerdi; üst sınır tabandan 5 mm pay bırakır.
const D_MIN = 0;
const D_MAX = 125;

const SIFIR_SURE = 1.2;

const yumusak = (t) => t * t * (3 - 2 * t);

// Verilen indirme ve kaptaki eksik su için dengeyi çözer: yüzey, batma ve yay birlikte.
// dalma: silindir tabanının yüzeyin altındaki derinliği (boyu aşabilir); batan = min(dalma, boy).
// f azalandır (yüzeyin eğimi 0,198 < 1 + 0,123), kök tektir ve [0, d] içindedir.
function coz(d, eksik) {
  const yuzeyde = (s) => Math.min(AGIZ, AGIZ + (SILINDIR_ALAN * s - eksik) / TASIRMA_ALAN);
  const f = (p) => {
    const s = Math.min(p, SILINDIR_BOY);
    return yuzeyde(s) - AGIZ + d - (RO_G * SILINDIR_ALAN * s) / YAY_K - p;
  };
  let alt = 0;
  let ust = Math.max(d, 0);
  if (f(0) <= 0) ust = 0;
  else {
    for (let i = 0; i < 30; i++) {
      const orta = (alt + ust) / 2;
      if (f(orta) > 0) alt = orta;
      else ust = orta;
    }
  }
  const dalma = (alt + ust) / 2;
  const batan = Math.min(dalma, SILINDIR_BOY);
  const kaldirma = RO_G * SILINDIR_ALAN * batan;
  const gerilme = AGIRLIK - kaldirma;
  return {
    dalma,
    batan,
    kaldirma,
    gerilme,
    uzama: gerilme / YAY_K,
    yuzey: yuzeyde(batan),
    taban: AGIZ - d + kaldirma / YAY_K,           // silindir tabanının kap tabanından yüksekliği
  };
}

// eksik: taşırma kabının dolu hâline göre eksik su. toplanan: toplama kabındaki su.
// İkisi yalnızca taşmayla birlikte artar; sıfırlamada ayrılırlar.
function ilk() {
  return { eksik: 0, toplanan: 0, sifir: null };
}

// Toplama kabı boşalır, taşırma kabı yeniden musluğa kadar dolar. Silindir o sırada sudaysa
// kap onun çevresinde dolar: eksik batan hacme iner, sıfıra değil.
function sifirla(durum) {
  if (durum.sifir) return durum;
  return { ...durum, sifir: { t: 0, eksik: durum.eksik, toplanan: durum.toplanan } };
}

function adim(durum, d, dt) {
  let { eksik, toplanan, sifir } = durum;
  if (sifir) {
    const t = Math.min(sifir.t + dt, SIFIR_SURE);
    const zarf = 1 - yumusak(t / SIFIR_SURE);
    eksik = sifir.eksik * zarf;
    toplanan = sifir.toplanan * zarf;
    sifir = t < SIFIR_SURE ? { ...sifir, t } : null;
  }
  const denge = coz(d, eksik);
  const tasan = Math.max(0, SILINDIR_ALAN * denge.batan - eksik);
  eksik += tasan;
  if (!durum.sifir) toplanan += tasan;
  return { durum: { eksik, toplanan, sifir }, denge, tasan: durum.sifir ? 0 : tasan };
}

// Parçaların yeri: gösterge diskinin ölçekteki yeri, toplama kabındaki seviye, ibrenin açısı.
function yerler(durum, denge) {
  const seviye = durum.toplanan / TOPLAMA_ALAN;
  return {
    uzama: denge.uzama,
    seviye,
    ibre: (RO_G * TOPLAMA_ALAN * seviye / TERAZI_TUR) * 360,
  };
}

// Sayılar parçaların yerinden okunur. "azalma" yaydan, "tasanSu" ibreden gelir; aynı sayıdan türemezler.
function oku(yer) {
  const dinamometre = YAY_K * yer.uzama;
  return {
    dinamometre,
    azalma: AGIRLIK - dinamometre,
    tasanSu: (yer.ibre / 360) * TERAZI_TUR,
  };
}

function bicim(x, hane = 2) {
  const yazi = Math.abs(x).toFixed(hane).replace('.', ',');
  return x < 0 && Number(yazi.replace(',', '.')) !== 0 ? '−' + yazi : yazi;
}

// Figürü bir duruma getirir. Sayfa (live.js) ve ders modülü (dersler/arsimet-sekil.js) aynı kodu kullanır.
// Kit (translateAlong, segment, pathOf, axisVector) ve model (YAY_K, AGIZ, SILINDIR_BOY, yerler) aynı kapsamda olmalıdır.
function cizimKur(kok, D, yayYolu, ibreYolu) {
  const P = D.P;
  const tek = (ad) => kok.querySelector(`[data-part="${ad}"]`);
  const hepsi = (ad) => [...kok.querySelectorAll(`[data-part="${ad}"]`)];
  const el = {
    tasiyici: tek("tasiyici"),
    silindir: hepsi("silindir"),
    cubukKirp: kok.querySelector("#kk-cubuk [data-hold]"),
    direkKirp: tek("direk-kirp"),
    gosterge: tek("gosterge"),
    yayArka: tek("yay-arka"),
    yayOn: tek("yay-on"),
    su: tek("su"),
    sualtiYuzey: tek("sualti-yuzey"),
    sualtiKapak: tek("sualti-kapak"),
    sualtiSap: tek("sualti-sap"),
    suCizgi: tek("su-cizgi"),
    beherSu: tek("beher-su"),
    akis: tek("akis"),
    akisCizgi: tek("akis-cizgi"),
    akisHalka: tek("akis-halka"),
    ibre: tek("ibre"),
  };
  const yumusat = (a, b, x) => {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  const kaydir = (dz) => (dz ? translateAlong(P, [0, 0, dz]) : "");
  const yaz = (dugum, ad, deger) => {
    if (dugum.getAttribute(ad) !== deger) dugum.setAttribute(ad, deger);
  };
  const yolOf = (noktalar) => pathOf(noktalar, true);

  // d: taşıyıcının indirilmesi; durum ve denge modelden; akis: akış çizgisinin zarfı, 0..1. Parçaların yerini döndürür.
  return function ciz(d, durum, denge, akis) {
    const kalkis = denge.kaldirma / YAY_K; // yay bu kadar kısaldı, silindir bu kadar yükseldi
    const yer = yerler(durum, denge);
    yaz(el.tasiyici, "transform", kaydir(-d));
    for (const dugum of el.silindir) yaz(dugum, "transform", kaydir(-d + kalkis));
    yaz(el.cubukKirp, "transform", kaydir(-kalkis));
    yaz(el.direkKirp, "transform", kaydir(-d));
    yaz(el.gosterge, "transform", kaydir(kalkis));
    const yay = yayYolu(D.yay.ust, D.yay.alt + kalkis, D.yay.c, D.yay.r, D.yay.tur, P);
    yaz(el.yayArka, "d", yay.arka);
    yaz(el.yayOn, "d", yay.on);

    const inis = denge.yuzey - AGIZ;
    yaz(el.su, "transform", kaydir(inis));
    yaz(el.sualtiYuzey, "transform", kaydir(inis));
    yaz(el.suCizgi, "transform", kaydir(inis));
    // Su çizgisi yalnızca silindir yüzeyi keserken görünür; iki uçta 2 mm'de girer ve çıkar.
    el.suCizgi.style.opacity = String(yumusat(0, 2, denge.dalma) * (1 - yumusat(SILINDIR_BOY - 0.5, SILINDIR_BOY + 1.5, denge.dalma)));
    // Silindir tümüyle batınca su üst yüzünü kenardan içeri doğru kapatır.
    const ortu = yumusat(SILINDIR_BOY, SILINDIR_BOY + 3, denge.dalma);
    if (ortu > 0) {
      const [cx, cy] = D.kapak.merkez;
      const dis = D.kapak.halka.map(([x, y]) => [cx + x, cy + y]);
      const ic = ortu < 1 ? D.kapak.halka.map(([x, y]) => [cx + x * (1 - ortu), cy + y * (1 - ortu)]) : [];
      yaz(el.sualtiKapak, "d", yolOf(dis) + (ic.length ? yolOf(ic) : ""));
      yaz(el.sualtiKapak, "transform", kaydir(-d + kalkis));
      // Üst yüzün üstünde, suyun içinde kalan sap ve çubuk: yüzeyden silindirin tepesine dar bir sütun.
      const birim = axisVector(P, [0, 0, 1])[1];
      const yYuzey = cy + birim * (D.yuzeyFarki + inis);
      const yTepe = cy + birim * (-d + kalkis);
      const yari = 3.4 * D.olcek * ortu;
      yaz(el.sualtiSap, "d", yolOf([[cx - yari, yYuzey], [cx + yari, yYuzey], [cx + yari, yTepe], [cx - yari, yTepe]]));
    } else {
      yaz(el.sualtiKapak, "d", "");
      yaz(el.sualtiSap, "d", "");
    }

    yaz(el.beherSu, "transform", kaydir(yer.seviye - D.beherSu));
    el.beherSu.style.opacity = String(yumusat(0, 0.8, yer.seviye));
    if (akis > 0.01) {
      el.akis.style.display = "";
      el.akis.style.opacity = String(akis);
      const [x, y, z] = D.akis.ust;
      yaz(el.akisCizgi, "d", segment([x, y, z], [x, y, D.akis.taban + yer.seviye], P));
      // Sayfada kesikler CSS ile akar; derste zamanlayıcı yoktur, kesikler toplanan suyla ilerler.
      yaz(el.akisCizgi, "stroke-dashoffset", (-(durum.toplanan / 350) % 8).toFixed(2));
      yaz(el.akisHalka, "transform", kaydir(yer.seviye - D.beherSu));
    } else el.akis.style.display = "none";
    yaz(el.ibre, "d", ibreYolu(yer.ibre / 360));
    return yer;
  };
}

// Sayfadaki döngü. Derleme bu dosyayı kit ve modelden sonra satır içine alır; __…__ yerlerini doldurur.
const D = {"P":{"origin":[271.5305092678538,473.1379773252511],"scale":0.900998042947541,"azimuth":48,"elevation":36},"yay":{"ust":378,"r":4.6,"tur":9,"alt":326.3995066835245,"c":[0,0]},"kadran":{"c":[100.91075553270363,34.840122857634555],"r":20,"ust":45,"sifir":-0.7330382858376184},"akis":{"ust":[90.23750254366767,-22.4987362907691,132.9],"taban":52},"beherSu":60,"kapak":{"merkez":[271.5305092678538,268.44899912824053],"halka":[[16.94,8.96],[14.34,10.41],[11.4,11.6],[8.17,12.51],[4.74,13.1],[1.19,13.38],[-2.38,13.32],[-5.9,12.94],[-9.27,12.24],[-12.41,11.24],[-15.25,9.96],[-17.71,8.43],[-19.74,6.7],[-21.28,4.8],[-22.3,2.79],[-22.76,0.7],[-22.67,-1.4],[-22.02,-3.47],[-20.82,-5.45],[-19.12,-7.3],[-16.94,-8.96],[-14.34,-10.41],[-11.4,-11.6],[-8.17,-12.51],[-4.74,-13.1],[-1.19,-13.38],[2.38,-13.32],[5.9,-12.94],[9.27,-12.24],[12.41,-11.24],[15.25,-9.96],[17.71,-8.43],[19.74,-6.7],[21.28,-4.8],[22.3,-2.79],[22.76,-0.7],[22.67,1.4],[22.02,3.47],[20.82,5.45],[19.12,7.3]]},"olcek":1.1396823932273756,"yuzeyFarki":-80,"derin":109.8520345616576};
const P = D.P;
const yayYolu = (zUst, zAlt, c, r, tur, P) => {
  const say = Math.max(1, Math.round(tur * 16));
  const arka = [];
  const on = [];
  let parca = [];
  let yakin = null;
  for (let i = 0; i <= say; i++) {
    const pay = i / say;
    const aci = pay * tur * Math.PI * 2;
    const yuzde = depthOf([Math.cos(aci), Math.sin(aci), 0], P) > 0;
    const duz = iso([c[0] + r * Math.cos(aci), c[1] + r * Math.sin(aci), zUst + (zAlt - zUst) * pay], P);
    if (yakin === null) yakin = yuzde;
    if (yuzde !== yakin) {
      parca.push(duz);
      (yakin ? on : arka).push(pathOf(parca));
      parca = [duz];
      yakin = yuzde;
      continue;
    }
    parca.push(duz);
  }
  if (parca.length > 1) (yakin ? on : arka).push(pathOf(parca));
  return { arka: arka.join(""), on: on.join("") };
};
const ibreYolu = (tur) => {
  const aci = D.kadran.sifir + tur * Math.PI * 2;
  const [x, y] = D.kadran.c;
  return lineOnTop([x - Math.sin(aci) * 3.6, y + Math.cos(aci) * 3.6], [x + Math.sin(aci) * (D.kadran.r - 5), y - Math.cos(aci) * (D.kadran.r - 5)], D.kadran.ust + 0.2, P);
};

const stage = document.querySelector(".kk-stage");
const svg = stage.querySelector("svg");
const cizFigur = cizimKur(svg, D, yayYolu, ibreYolu);
const gostergeYazi = document.querySelector("[data-readout]");
const durumYazi = stage.querySelector("[data-durum]");
const sakin = matchMedia("(prefers-reduced-motion: reduce)");

const sinirla = (x, a, b) => Math.min(b, Math.max(a, x));
const yumusat = (a, b, x) => {
  const t = sinirla((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
// Durum: d gösterilen indirme, hedef istenen. Model yarı-statiktir; yay her an dengededir.
let d = 0;
let hedef = 0;
let durum = ilk();
let denge = coz(0, 0);
let akis = 0; // akış çizgisinin zarfı, 0..1
let bekleyenSifir = false; // sıfırlama önce silindiri sudan çıkarır
let kare = 0;
let son = 0;
let saat = 0;
let turda = !sakin.matches;
let turSifirladi = false;
let gorunur = false;
let bosZaman = 0;
let sonYazi = "";

// Boşta tur: yavaşça indir (tam batana ve 20 mm daha derine), bekle, kaldır, sıfırla, yinele.
const TUR = [
  [0, 0],
  [1.2, 0],
  [9.2, D.derin],
  [11.2, D.derin],
  [16.2, 0],
  [19.4, 0],
];
const TUR_SIFIR = 16.6;
const turHedefi = (t) => {
  for (let i = 1; i < TUR.length; i++) {
    if (t <= TUR[i][0]) return TUR[i - 1][1] + (TUR[i][1] - TUR[i - 1][1]) * yumusat(TUR[i - 1][0], TUR[i][0], t);
  }
  return 0;
};

function ciz() {
  const yer = cizFigur(d, durum, denge, akis);
  // Sayılar parçaların o anki yerinden okunur: yaydan ve ibreden.
  const okunan = oku(yer);
  const mesgul = bekleyenSifir || durum.sifir;
  const yazi = mesgul ? "sıfırlanıyor" : `dinamometre ${bicim(okunan.dinamometre)} N · azalma ${bicim(okunan.azalma)} N · taşan su ${bicim(okunan.tasanSu)} N`;
  if (yazi !== sonYazi) {
    gostergeYazi.textContent = yazi;
    sonYazi = yazi;
  }
  return okunan;
}

// Erişilebilir değer her karede değil, hareket durunca yazılır.
function anlat(okunan) {
  const konum = denge.dalma <= 0 ? "Silindir suyun üstünde" : denge.dalma < SILINDIR_BOY ? `Silindirin ${Math.round(denge.batan)} milimetresi suda` : "Silindir tümüyle suda";
  stage.setAttribute("aria-valuenow", String(Math.round(d)));
  stage.setAttribute("aria-valuetext", `${konum}. Dinamometre ${bicim(okunan.dinamometre)} newton, azalma ${bicim(okunan.azalma)} newton, taşan su ${bicim(okunan.tasanSu)} newton.`);
}

function adimAt(simdi) {
  const dt = son ? Math.min((simdi - son) / 1000, 1 / 30) : 1 / 60;
  son = simdi;
  const dingin = sakin.matches;
  if (turda) {
    saat += dt;
    if (saat >= TUR[TUR.length - 1][0]) {
      saat = 0;
      turSifirladi = false;
    }
    hedef = turHedefi(saat);
    if (saat >= TUR_SIFIR && !turSifirladi) {
      turSifirladi = true;
      bekleyenSifir = true;
    }
  }
  if (bekleyenSifir) hedef = 0;
  d = dingin ? hedef : d + (hedef - d) * (1 - Math.exp(-dt / (turda ? 0.12 : 0.32)));
  if (Math.abs(hedef - d) < 0.02) d = hedef;
  if (bekleyenSifir && d === 0) {
    bekleyenSifir = false;
    durum = sifirla(durum);
    durumYazi.textContent = "Düzenek sıfırlanıyor.";
  }
  const sifirdaydi = Boolean(durum.sifir);
  const sonuc = adim(durum, d, dingin && durum.sifir ? SIFIR_SURE : dt);
  durum = sonuc.durum;
  denge = sonuc.denge;
  if (sifirdaydi && !durum.sifir) durumYazi.textContent = "Düzenek sıfırlandı: toplama kabı boş, taşırma kabı dolu.";
  const akiyor = sonuc.tasan > 1e-6 ? 1 : 0;
  akis = dingin ? akiyor : akis + (akiyor - akis) * (1 - Math.exp(-dt / (akiyor ? 0.09 : 0.22)));
  if (akis < 0.004) akis = 0;
  const okunan = ciz();
  const durdu = !turda && d === hedef && !durum.sifir && !bekleyenSifir && akis === 0;
  if (durdu) anlat(okunan);
  kare = gorunur && !durdu ? requestAnimationFrame(adimAt) : 0;
}
const kos = () => {
  if (!kare && gorunur) {
    son = 0;
    kare = requestAnimationFrame(adimAt);
  }
};
// Okuyucu devralır: tur durur, durum olduğu yerde kalır; 3,6 sn sessizlikten sonra tur sürer.
function devral() {
  turda = false;
  clearTimeout(bosZaman);
  bosZaman = setTimeout(() => {
    turda = !sakin.matches;
    saat = 0;
    turSifirladi = false;
    kos();
  }, 3600);
}
function yonel(yeni) {
  devral();
  bekleyenSifir = false;
  hedef = sinirla(yeni, D_MIN, D_MAX);
  kos();
}
function sifirlaIste() {
  devral();
  if (!durum.sifir) bekleyenSifir = true;
  kos();
}

new IntersectionObserver(
  (girdiler) => {
    gorunur = girdiler[girdiler.length - 1].isIntersecting;
    if (gorunur) kos();
  },
  { rootMargin: "120px 0px" },
).observe(stage);
sakin.addEventListener("change", () => {
  turda = turda && !sakin.matches;
  kos();
});

// İşaretçi: sahnedeki düşey konum indirme miktarına eşlenir (üstte 0, altta en derin).
const isaretten = (olay) => {
  const kutu = svg.getBoundingClientRect();
  return sinirla(((olay.clientY - kutu.top) / kutu.height - 0.18) / 0.6, 0, 1) * D_MAX;
};
stage.addEventListener("pointermove", (olay) => {
  if (olay.pointerType === "touch") return;
  yonel(isaretten(olay));
});
stage.addEventListener("pointerdown", (olay) => yonel(isaretten(olay)));
stage.addEventListener("keydown", (olay) => {
  const adimBoyu = olay.shiftKey ? 10 : 2;
  const buradan = turda ? d : hedef; // turdayken okuyucunun gördüğü yerden adımla
  let yeni = null;
  if (olay.key === "ArrowDown") yeni = buradan + adimBoyu;
  if (olay.key === "ArrowUp") yeni = buradan - adimBoyu;
  if (olay.key === "Home") yeni = D_MIN;
  if (olay.key === "End") yeni = D_MAX;
  if (olay.key === "Enter") {
    olay.preventDefault();
    sifirlaIste();
    return;
  }
  if (yeni === null) return;
  olay.preventDefault();
  yonel(yeni);
});
stage.addEventListener("focus", () => anlat(oku(yerler(durum, denge))));
ciz();
</script></body></html>
