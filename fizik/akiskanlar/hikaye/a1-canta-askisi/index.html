    <script>
      /* ============================================================
         Çantanın askısı  ·  A1 Basınç neye bağlı?
         Tek dünya, tek zaman çizelgesi. Her şey zamanın saf fonksiyonu.
         ============================================================ */
      const NS = "http://www.w3.org/2000/svg";
      const R = {
        kagit: "#f4ecd9", murekkep: "#2b2733", iz: "#d7372f",
        duvar: "#efd59a", ahsap: "#c98f58", ahsapKoyu: "#a9713f", zemin: "#d6a468",
        gok: "#9cc8e3", gunes: "#f6d36b", su: "#6fb1dc", cati: "#cf9468", agac: "#84b07a", agacKoyu: "#5f9463",
        demir: "#8b9bb0", perde: "#d9e4ee", beyaz: "#fbf6ea",
        sirt: "#2a8f95", sirtKoyu: "#1f7078", torba: "#35508f", torbaKoyu: "#27407a",
        kazak: "#e2ad3b", pantolon: "#4c5a78", ten: "#e9b996", sac: "#3a2d2a",
        kitap: ["#4a78c2", "#a9bf4e", "#8e68b0", "#e58a3a", "#3f7d5a"],
        saksi: "#c58a5e", mantar: "#d8b98a", hali: "#a9c4dc", dolap: "#c7a273",
      };

      /* Anlatım satırlarının başlangıçları (sn), gerçek klip sürelerine göre. Klipler yeniden üretilirse
         burası ve <audio> öğelerinin data-start değerleri birlikte düzeltilir. Cümle içi eşlemeler
         (ör. l9 + 2.5 = "Bütün kuvvet o dar şeride biner") kliplerdeki sessizliklerden ölçüldü. */
      const T = {
        l1: 0.6, l2: 4.75, l3: 8.66, l4: 13.1, l5: 17.21, l6: 23.66, l7: 27.77,
        l8: 32.13, l9: 36.01, l10: 41.73, l11: 48.01, l12: 53.24, l13: 59.03, l14: 63.65, son: 72.5,
      };

      /* ---------- çizim yardımcıları ---------- */
      function el(tag, attrs, parent) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      const f = (n) => (+n).toFixed(1);
      const dik = (x, y, w, h) => `M${f(x)} ${f(y)}H${f(x + w)}V${f(y + h)}H${f(x)}Z`;
      const cokgen = (P) => "M" + P.map((p) => f(p[0]) + " " + f(p[1])).join("L") + "Z";
      const elips = (cx, cy, rx, ry) => `M${f(cx - rx)} ${f(cy)}A${f(rx)} ${f(ry)} 0 1 0 ${f(cx + rx)} ${f(cy)}A${f(rx)} ${f(ry)} 0 1 0 ${f(cx - rx)} ${f(cy)}Z`;
      /* kapsül: kol, bacak, askı gibi iki ucu yuvarlak parça */
      function kapsul(x1, y1, x2, y2, r) {
        const u = Math.hypot(x2 - x1, y2 - y1) || 1, nx = (-(y2 - y1) / u) * r, ny = ((x2 - x1) / u) * r;
        return `M${f(x1 + nx)} ${f(y1 + ny)}L${f(x2 + nx)} ${f(y2 + ny)}A${f(r)} ${f(r)} 0 0 1 ${f(x2 - nx)} ${f(y2 - ny)}L${f(x1 - nx)} ${f(y1 - ny)}A${f(r)} ${f(r)} 0 0 1 ${f(x1 + nx)} ${f(y1 + ny)}Z`;
      }
      /* boya lekesi: çizgiden birkaç piksel kaymış, süzgeçli */
      function boya(g, d, renk, opak, dx, dy, dar) {
        return el("path", { d, fill: renk, opacity: opak == null ? 0.86 : opak, filter: dar ? "url(#suluboya-ince)" : "url(#suluboya)", transform: `translate(${dx == null ? 5 : dx} ${dy == null ? 4 : dy})` }, g);
      }
      function hat(g, d, kalin, ek) {
        return el("path", Object.assign({ d, fill: "none", stroke: R.murekkep, "stroke-width": kalin || 3.5, "stroke-linecap": "round", "stroke-linejoin": "round" }, ek || {}), g);
      }
      /* nesne: kâğıt örtü (arkadaki çizgiyi kapatır) + boya + kontur */
      function nesne(g, d, renk, o) {
        o = o || {};
        el("path", { d, fill: R.kagit }, g);
        if (renk) boya(g, d, renk, o.opak, o.dx, o.dy, o.dar);
        return hat(g, d, o.kalin);
      }
      /* uzuv: kalın çizgiyle çizilen bükülebilir parça (kol, askı); eklem yerinde iç çizgi kalmaz */
      function uzuv(g, d, w, renk) {
        hat(g, d, w + 7);
        hat(g, d, w, { stroke: R.kagit });
        const s = el("g", { opacity: 0.86, filter: "url(#suluboya-ince)", transform: "translate(2 2)" }, g);
        const b = hat(s, d, w - 1, { stroke: renk }).getBBox();
        el("rect", { x: b.x - w, y: b.y - w, width: b.width + 2 * w, height: b.height + 2 * w, fill: "none" }, s);
        return s;
      }
      const ince = { "stroke-opacity": 0.72 };

      /* d'si sonradan verilen nesne (biçimi zamanla değişenler için) */
      function canli(g, renk, o) {
        o = o || {};
        const a = el("path", { d: "M0 0", fill: R.kagit }, g);
        const b = renk ? boya(g, "M0 0", renk, o.opak, o.dx, o.dy, o.dar) : null;
        const c = hat(g, "M0 0", o.kalin);
        return function (d) {
          a.setAttribute("d", d);
          if (b) b.setAttribute("d", d);
          c.setAttribute("d", d);
        };
      }
      function yazi(parent, x, y, metin, boyut, ek) {
        const t = el("text", Object.assign({ x, y, "font-size": boyut, fill: R.murekkep, "text-anchor": "middle", "font-weight": 600 }, ek || {}), parent);
        t.textContent = metin;
        return t;
      }
      /* ince ip: mürekkep kenarlı, kâğıt renginde */
      function ip(g, d, w) {
        const a = hat(g, d, w || 9), b = hat(g, d, (w || 9) - 4, { stroke: R.kagit });
        return function (yeni) {
          a.setAttribute("d", yeni);
          b.setAttribute("d", yeni);
        };
      }

      /* ---------- iki çanta (her yerde aynı çizim) ---------- */
      /* ipli torba: alt orta (0,0). İç kısım `arka`ya, gövde ve ipler `on`a çizilir; araya kitap girebilir. */
      function torbaCiz(arka, on, renk, koyu) {
        nesne(arka, elips(0, -252, 53, 15), koyu, { dx: 1, dy: 2, kalin: 3, dar: 1 });
        nesne(on, "M-94 0Q-118 -100 -80 -198Q-70 -236 -52 -252Q0 -228 52 -252Q70 -236 80 -198Q116 -100 92 0Z", renk);
        hat(on, "M-74 -196Q-52 -180 -42 -224M74 -196Q52 -180 42 -224M-22 -206Q-12 -150 -26 -80M28 -204Q20 -140 36 -60", 2.2, ince);
        ip(on, "M-50 -248C-146 -228 -150 -52 -90 -6");
        ip(on, "M50 -248C150 -228 152 -52 88 -6");
      }
      /* sırt çantası, asılı: tutamağın tepesi (0,0). Geniş askılar iki yandan sarkar. */
      function sirtCiz(g, renk, koyu) {
        ["M-68 56C-142 80 -160 220 -140 378", "M68 56C142 80 160 220 140 378"].forEach((d) => {
          uzuv(g, d, 44, koyu);
          hat(g, d, 2, { "stroke-dasharray": "9 9", "stroke-opacity": 0.7 });
        });
