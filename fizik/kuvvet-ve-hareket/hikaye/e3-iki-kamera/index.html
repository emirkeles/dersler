      <!-- Kâğıt dişi: ekrana sabit, en üstte -->
      <svg data-hf-id="hf-ca7t" id="dis-kat" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="mix-blend-mode: multiply">
        <rect data-hf-id="hf-53so" width="1920" height="1080" filter="url(#dis)" />

    </div>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const ekle = (ust, ad, oz) => {
        const e = document.createElementNS(NS, ad);
        for (const k in oz) e.setAttribute(k, oz[k]);
        ust.appendChild(e);
        return e;
      };

      /* Ölçek: 120 px = 1 km. */
      const KM = 120,
        SOL = 240,
        SAG = SOL + 12 * KM,
        YOL_Y = 770;
      /* Kadran: 0 km/h 150°, 180 km/h 390°. Sınır (90) tam tepede (270°). */
      const ACI0 = 150,
        ACI_KMH = 240 / 180;
      const aci = (kmh) => ACI0 + kmh * ACI_KMH;

      const taslar = document.getElementById("km-taslari");
      for (let k = 0; k <= 12; k++) ekle(taslar, "rect", { x: SOL + k * KM - 5, y: 660, width: 10, height: 24, rx: 3 });

      function kadran(id, cx, cy) {
        const g = document.getElementById(id);
        for (let v = 0; v <= 180; v += 10) {
          const r = (aci(v) * Math.PI) / 180,
            buyuk = v % 20 === 0,
            ic = buyuk ? 140 : 152;
          ekle(g, "line", {
            x1: cx + 168 * Math.cos(r),
            y1: cy + 168 * Math.sin(r),
            x2: cx + ic * Math.cos(r),
            y2: cy + ic * Math.sin(r),
            stroke: "#f4ead5",
            "stroke-width": buyuk ? 6 : 3,
            "stroke-linecap": "round",
          });
        }
        for (const v of [60, 120]) {
          const r = (aci(v) * Math.PI) / 180;
          const t = ekle(g, "text", {
            x: cx + 110 * Math.cos(r),
            y: cy + 110 * Math.sin(r),
            "text-anchor": "middle",
            "dominant-baseline": "central",
            "font-size": 28,
            "font-weight": 500,
            fill: "#f4ead5",
          });
          t.textContent = v;
        }
      }
      kadran("kadranL", 480, 300);
      kadran("kadranR", 1440, 300);
      kadran("kadranH", 1520, 250);

      /* Satır başlangıçları (sn). Ses üretilince gerçek klip sürelerine çekilir. */
      /* Kare başlangıçları (sn) ve anlatım kliplerinin başlangıçları. Kliplerin gerçek sürelerinden ve cümle içi
         duraklamalarından ölçüldü (assets/ses-esit/olcum.json); klipler yeniden üretilirse buradan düzeltilir. */
      const T = { l1: 0, l2: 6.4, l3: 9.6, l4: 16.1, l5: 21.7, l6: 26.3, l7: 32.6, l8: 39.4, l9: 44.9, l10: 50.3, l11: 57.6, l12: 62.3, son: 71 };

      const tl = gsap.timeline({ paused: true });

      function olcum(yan, cx, direkX, t) {
        const O = cx + " 300";
        tl.fromTo(
          "#cakma" + yan,
          { scale: 0.25, opacity: 0.95, svgOrigin: direkX + " " + YOL_Y },
          { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
          t,
        );
        tl.fromTo("#bag" + yan, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, t + 0.2);
        tl.fromTo(
          "#gosterge" + yan,
          { scale: 0, opacity: 0, svgOrigin: O },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          t + 0.2,
        );
        tl.fromTo(
          "#ibre" + yan,
          { rotation: aci(0), svgOrigin: O },
          { rotation: aci(85), duration: 0.95, ease: "power2.out" },
          t + 0.55,
        );
        tl.fromTo("#okuma" + yan, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t + 1.25);
      }

      /* Kare 1 — iki-gosterge */
      olcum("L", 480, SOL, T.l1 + 0.7);
      olcum("R", 1440, SAG, T.l1 + 1.8);
      tl.fromTo(
        "#tabela",
        { scale: 0, opacity: 0, svgOrigin: "960 690" },
        { scale: 1, opacity: 1, duration: 0.55, ease: "expo.out" },
        T.l1 + 4.55,
      );

      /* Kare 2 — ceza: zarf iner, sonra kare donar ("Neden?"). */
      tl.fromTo(
        "#zarf",
        { y: -540, rotation: -12, opacity: 0, svgOrigin: "960 300" },
        { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        T.l2 + 0.35,
      );

      /* Kare 3 — saat: zarf çekilir, göstergeler küçülüp solar, direklere saat damgaları dikilir. */
      tl.fromTo(
        "#zarf",
        { scale: 1, opacity: 1, y: 0 },
        { scale: 0.6, opacity: 0, y: -70, duration: 0.4, ease: "power2.in", immediateRender: false },
        T.l3 + 0.1,
      );
      for (const [yan, cx] of [["L", 480], ["R", 1440]]) {
        tl.fromTo(
          "#gostergeDis" + yan,
          { scale: 1, opacity: 1, svgOrigin: cx + " 150" },
          { scale: 0.55, opacity: 0.4, duration: 0.7, ease: "power2.inOut" },
          T.l3 + 1.6,
        );
        tl.fromTo(
          "#bag" + yan,
          { opacity: 1 },
          { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false },
          T.l3 + 1.6,
        );
      }
      tl.fromTo(
        "#damgaL",
        { scale: 0, opacity: 0, svgOrigin: SOL + " 660" },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        T.l3 + 4.6,
      );
      tl.fromTo(
        "#damgaR",
        { scale: 0, opacity: 0, svgOrigin: SAG + " 660" },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        T.l3 + 4.8,
      );

      /* ---- Kareler 4–6: yolculuk ----
         Sürat (km/h) zamanın parçalı doğrusal fonksiyonudur; arabanın konumu onun integralidir.
         Ekranda 85 km/h = saniyede 100 px. Bu bölüm canlandırmadır: 6 dakikalık yol yaklaşık 10 saniyeye sığar;
         ölçekli tekrar 9. karededir. */
      /* İşaret anları anlatımdan gelir: "frene bastı" 18,2 · "gaza bastı" 22,9 · "Yine fren" 29,6.
         İki kamera arası 1440 px olduğuna göre ekran ölçeği (PX: km/h başına px/sn) bu anlardan çözülür. */
      const fren1 = T.l4 + 2.1,
        cak1 = fren1 + 1.8,
        gaz = T.l5 + 1.2,
        gazSon = gaz + 1.4,
        fren2 = T.l6 + 3.3,
        cak2 = fren2 + 1.8;
      const PX =
        (SAG - SOL) /
        (85 * (gaz - cak1) + ((85 + 130) / 2) * 1.4 + 130 * (fren2 - gazSon) + ((130 + 85) / 2) * 1.5 + 85 * 0.3);
      const HIZ = [
        [fren1, 130],
        [fren1 + 1.5, 85],
        [gaz, 85],
        [gazSon, 130],
        [fren2, 130],
        [fren2 + 1.5, 85],
      ];
      function hiz(t) {
        if (t <= HIZ[0][0]) return HIZ[0][1];
        for (let i = 1; i < HIZ.length; i++)
          if (t <= HIZ[i][0]) {
            const [a, va] = HIZ[i - 1],
              [b, vb] = HIZ[i];
            return va + ((vb - va) * (t - a)) / (b - a);
          }
        return HIZ[HIZ.length - 1][1];
      }
      /* ∫ hız dt, HIZ[0] anından t'ye (km/h · sn) */
      function yolInt(t) {
        let s = (Math.min(t, HIZ[0][0]) - HIZ[0][0]) * HIZ[0][1];
        for (let i = 1; i < HIZ.length; i++) {
          const [a, va] = HIZ[i - 1],
            [b, vb] = HIZ[i];
          if (t <= a) break;
          const u = Math.min(t, b);
          s += ((va + (va + ((vb - va) * (u - a)) / (b - a))) / 2) * (u - a);
        }
        const son = HIZ[HIZ.length - 1];
        if (t > son[0]) s += (t - son[0]) * son[1];
        return s;
      }
      const konum = (t) => SOL + PX * (yolInt(t) - yolInt(cak1));

      const dunya = document.getElementById("dunya"),
        araba = document.getElementById("araba"),
        frenIsik = document.getElementById("fren"),
        izler = [1, 2, 3].map((i) => document.getElementById("iz" + i)),
        olcu = document.getElementById("olcu"),
        olcuCizgi = document.getElementById("olcu-cizgi"),
        olcuUc = document.getElementById("olcu-uc"),
        kmSayac = document.getElementById("km-sayac"),
        kmEtiket = document.getElementById("km-etiket"),
        ibreH = document.getElementById("ibreH"),
        okumaH = document.getElementById("okumaH");
      const YAKIN = { x: SOL - 480, y: 440, w: 960 };

      /* ---- Kare 9: ölçekli tekrar. Sayaç dakikadır (0–8); iki arabanın konumu ondan hesaplanır. ---- */
      const kis = (v, a, b) => Math.min(b, Math.max(a, v));
      const yumusak = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      function dakika(t) {
        const a = T.l9 + 0.8;
        if (t <= a) return 0;
        if (t <= a + 2.2) return (6 * (t - a)) / 2.2; /* gerçek araba 14.06'da varır */
        if (t <= a + 2.6) return 6; /* kısa duruş: kamera çakar */
        return Math.min(8, 6 + (2 * (t - a - 2.6)) / 0.9); /* yeşil araba "sekiz dakikada" derken varır */
      }
      /* Gerçek araba: uçlarda birer kilometre 95 km/h, ortadaki 10 km daha hızlı; 6. dakikada tam 12 km. */
      const UC_DK = 60 / 95,
        ORTA = 10 / (6 - 2 * UC_DK);
      function gercekKm(m) {
        if (m <= UC_DK) return m / UC_DK;
        if (m <= 6 - UC_DK) return 1 + ORTA * (m - UC_DK);
        return 11 + (m - (6 - UC_DK)) / UC_DK;
      }
      const araba90 = document.getElementById("araba90"),
        dkSayac = document.getElementById("dk-sayac");
      const kamSon = Math.max(YAKIN.x, konum(T.l7) - 480);

      function ciz(t) {
        const surus = konum(t);
        /* Kamera: 4. karede sol uca yaklaşır, arabayı ortada tutarak izler, 7. karede geri çekilir. */
        let kx, ky, kw;
        if (t < T.l7) {
          const p = kis((t - T.l4) / 1.1, 0, 1),
            e = yumusak(p);
          kx = p < 1 ? YAKIN.x * e : Math.max(YAKIN.x, surus - 480);
          ky = YAKIN.y * e;
          kw = 1920 - (1920 - YAKIN.w) * e;
        } else {
          const e = 1 - yumusak(kis((t - T.l7 - 0.1) / 1.3, 0, 1));
          kx = kamSon * e;
          ky = YAKIN.y * e;
          kw = 1920 - (1920 - YAKIN.w) * e;
        }
        dunya.setAttribute("viewBox", kx.toFixed(2) + " " + ky.toFixed(2) + " " + kw.toFixed(2) + " " + ((kw * 9) / 16).toFixed(2));

        /* Arabalar */
        const m = dakika(t),
          tekrar = t >= T.l9 && t < T.l10 + 0.5;
        const x = tekrar ? SOL + KM * gercekKm(m) : t < T.l9 ? surus : -500;
        const gorun = tekrar ? kis((t - T.l9 - 0.2) / 0.4, 0, 1) * (1 - kis((t - T.l10) / 0.4, 0, 1)) : 1;
        araba.setAttribute("transform", "translate(" + x.toFixed(2) + " 805)");
        araba.setAttribute("opacity", t >= T.l4 && t < T.l10 + 0.5 ? gorun.toFixed(2) : 0);
        const m90 = m < 8 ? m : 8 + (2 / 0.9) * (t - (T.l9 + 4.3)); /* 8. dakikadan sonra aynı tempoda sürer */
        araba90.setAttribute("transform", "translate(" + (SOL + KM * 1.5 * m90).toFixed(2) + " 805)");
        araba90.setAttribute("opacity", tekrar ? gorun.toFixed(2) : 0);

        const v = hiz(t),
          yolda = t < T.l7;
        const frende = yolda && ((t > fren1 && t < fren1 + 1.5) || (t > fren2 && t < fren2 + 1.5));
        frenIsik.setAttribute("opacity", frende ? 1 : 0);
        const k = yolda ? Math.max(0, (v - 85) / 45) : 0;
        izler.forEach((cz, i) => {
          cz.setAttribute("x2", (+cz.getAttribute("x1") - k * (i === 1 ? 84 : 58)).toFixed(1));
          cz.setAttribute("opacity", (0.75 * k).toFixed(2));
        });

        /* Şerit metre: ilk kameradan arabaya; 7. karede etiket şeridin ortasına kayar. */
        const uc = yolda ? kis(surus, SOL, SAG) : SAG;
        const kay = -620 * yumusak(kis((t - T.l7 - 3.0) / 0.8, 0, 1));
        olcu.setAttribute("opacity", t >= cak1 ? 1 : 0);
        olcuCizgi.setAttribute("x2", uc.toFixed(2));
        olcuUc.setAttribute("x1", uc.toFixed(2));
        olcuUc.setAttribute("x2", uc.toFixed(2));
        kmEtiket.setAttribute("transform", "translate(" + (uc + kay).toFixed(2) + " 0)");
        kmSayac.textContent = Math.floor((uc - SOL) / KM + 1e-6) + " km";

        /* Süre etiketi: 7. karede 0'dan 6'ya sayar; 9. karede sayaçla birlikte yeniden sayar. */
        const dk = t < T.l9 + 0.8 ? Math.round(6 * kis((t - T.l7 - 4.8) / 0.7, 0, 1)) : Math.min(6, Math.floor(m + 1e-6));
        dkSayac.textContent = dk + " dk";

        /* Büyük gösterge */
        ibreH.setAttribute("transform", "rotate(" + aci(v).toFixed(2) + " 1520 250)");
        okumaH.textContent = Math.round(v);
      }

      const saat = { t: 0 };
      tl.fromTo(saat, { t: 0 }, { t: T.son, duration: T.son, ease: "none", onUpdate: () => ciz(saat.t) }, 0);
      ciz(0);

      /* Kare 4'ün girişi: damgalar toplanır, soluk göstergeler silinir, büyük gösterge gelir. */
      for (const [yan, dx] of [["L", SOL], ["R", SAG]]) {
        tl.fromTo(
          "#damga" + yan,
          { scale: 1, opacity: 1, svgOrigin: dx + " 660" },
          { scale: 0, opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false },
          T.l4 + 0.1,
        );
        tl.fromTo(
          "#gostergeDis" + yan,
          { opacity: 0.4 },
          { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false },
          T.l4 + 0.1,
        );
      }
      tl.fromTo(
        "#gostergeH",
        { scale: 0, opacity: 0, svgOrigin: "1520 250" },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        T.l4 + 0.7,
      );

      /* Tabela: yakın planda büyük göstergenin arkasından geçmesin diye yatar; gösterge solunda kalınca
         yerinden yeniden kalkar (araba x = 865'e vardığında tabela ekranda göstergenin hemen solundadır). */
      let ta = cak1,
        tb = cak2;
      for (let i = 0; i < 40; i++) {
        const tm = (ta + tb) / 2;
        if (konum(tm) < 865) ta = tm;
        else tb = tm;
      }
      const tabelaKalk = ta;
      tl.fromTo(
        "#tabela",
        { scale: 1, opacity: 1, svgOrigin: "960 690" },
        { scale: 0, opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false },
        T.l4 + 0.1,
      );
      tl.fromTo(
        "#tabela",
        { scale: 0, opacity: 0, svgOrigin: "960 690" },
        { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false },
        tabelaKalk,
      );

      /* Kameralar: araba tam altından geçerken çakar, saat damgası direğe dikilir. */
      for (const [yan, dx, t] of [["L", SOL, cak1], ["R", SAG, cak2]]) {
        tl.fromTo(
          "#cakma" + yan,
          { scale: 0.25, opacity: 0.95, svgOrigin: dx + " " + YOL_Y },
          { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
          t,
        );
        tl.fromTo(
          "#damga" + yan,
          { scale: 0, opacity: 0, svgOrigin: dx + " 660" },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
          t + 0.12,
        );
      }

      /* ---- Kare 7 — damgalar: kamera geri çekilir (ciz), büyük gösterge çıkar, süre ayracı çizilir. ---- */
      tl.fromTo(
        "#gostergeH",
        { scale: 1, opacity: 1, svgOrigin: "1520 250" },
        { scale: 0.5, opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false },
        T.l7 + 0.1,
      );
      tl.fromTo("#sure-cizgi", { strokeDashoffset: 1564 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, T.l7 + 4.3);
      tl.fromTo(
        "#sure-etiket",
        { scale: 0, opacity: 0, svgOrigin: "960 400" },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        T.l7 + 4.7,
      );

      /* ---- Kare 8 — bolme: işlem gelir, sonuca döner. ---- */
      tl.fromTo(
        "#islemA",
        { scale: 0, opacity: 0, svgOrigin: "960 220" },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        T.l8 + 0.3,
      );
      tl.fromTo(
        "#islemA",
        { scale: 1, opacity: 1 },
        { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false },
        T.l8 + 2.9,
      );
      tl.fromTo(
        "#islemB",
        { scale: 0.7, opacity: 0, y: 0, svgOrigin: "960 220" },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        T.l8 + 3.1,
      );

      /* ---- Kare 9 — sinira-uyan: arabalar ciz içinde; gerçek araba varınca kamera çakar, sonra "8 dk". ---- */
      tl.fromTo(
        "#cakmaR",
        { scale: 0.25, opacity: 0.95, svgOrigin: SAG + " " + YOL_Y },
        { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
        T.l9 + 3.0,
      );
      tl.fromTo(
        "#dk8",
        { scale: 0, opacity: 0, svgOrigin: SAG + " 914" },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        T.l9 + 4.3,
      );

      /* ---- Kare 10 — anlik: süreler toplanır, 1. karedeki iki gösterge geri gelir ve kameralara bağlanır. ---- */
      tl.fromTo("#sure", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in" }, T.l10 + 0.1);
      tl.fromTo("#dk8", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, T.l10 + 0.1);
      for (const [yan, cx, dx, i] of [["L", 480, SOL, 0], ["R", 1440, SAG, 1]]) {
        tl.fromTo(
          "#damga" + yan,
          { scale: 1, opacity: 1, svgOrigin: dx + " 660" },
          { scale: 0, opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false },
          T.l10 + 0.1,
        );
        tl.fromTo(
          "#gostergeDis" + yan,
          { scale: 0.55, opacity: 0, svgOrigin: cx + " 150" },
          { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out", immediateRender: false },
          T.l10 + 0.5 + i * 0.25,
        );
        tl.fromTo(
          "#bag" + yan,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out", immediateRender: false },
          T.l10 + 1.0 + i * 0.25,
        );
        /* "o anın sürati": bağın şeride değdiği nokta bir kez parlar */
        tl.fromTo(
          "#cakma" + yan,
          { scale: 0.2, opacity: 0.9, svgOrigin: dx + " " + YOL_Y },
          { scale: 1.0, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false },
          T.l10 + 3.3 + i * 0.25,
        );
      }

      /* ---- Kare 11 — ortalama: kalın ayraç bütün şeridi sarar, 120 km/h ayraca iner. ---- */
      tl.fromTo(
        "#ayrac",
        { scaleX: 0, opacity: 1, svgOrigin: SOL + " 888" },
        { scaleX: 1, opacity: 1, duration: 1.0, ease: "power2.inOut" },
        T.l11 + 1.2,
      );
      tl.fromTo("#km-etiket", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in" }, T.l11 + 1.8);
      tl.fromTo(
        "#islemB",
        { y: 0, scale: 1 },
        { y: 726, scale: 0.8, duration: 0.8, ease: "power3.inOut", immediateRender: false },
        T.l11 + 2.0,
      );

      /* ---- Kare 12 — kapanis: perde iner, kart gelir, cümle iki parça hâlinde okunur. ---- */
      for (const yan of ["L", "R"]) {
        tl.fromTo(
          "#gostergeDis" + yan,
          { opacity: 1 },
          { opacity: 0, duration: 0.45, ease: "power1.in", immediateRender: false },
          T.l12 + 0.05,
        );
        tl.fromTo("#bag" + yan, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.in", immediateRender: false }, T.l12 + 0.05);
      }
      tl.fromTo(
        "#tabela",
        { scale: 1, opacity: 1, svgOrigin: "960 690" },
        { scale: 0, opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false },
        T.l12 + 0.05,
      );
      tl.fromTo("#perde", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, T.l12 + 0.1);
      tl.fromTo("#kart", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, T.l12 + 0.3);
      tl.fromTo("#c1", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, T.l12 + 0.75);
      tl.fromTo("#c2", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, T.l12 + 3.1);
      tl.fromTo("#cizgi", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, T.l12 + 4.7);
      tl.fromTo("#model", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, T.l12 + 4.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
