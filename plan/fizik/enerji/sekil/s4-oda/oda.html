.iso[data-theme="light"]{

.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}

.iso-dots[data-tone="lo"] circle{opacity:.22}

@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}

6 412.6M506 473L499.5 476.9L498.3 476.9L496.6 475.9M506 412.6L506 473M496.6 415.5L496.6 475.9"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Termometre sütunu (0–50 °C) ve çalışan ısı kaynağının kızgın yüzeyi</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Soba, kalorifer peteği, elektrikli ısıtıcı, pencere</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Odanın iç yüzlerindeki ton: hava (boşaltılınca söner)</span></span><span class="iso-caption">Oda bir makettir: ön iki duvarı ve tavanı yoktur. Soba ve petek sol arka duvardadır, pencere sağ arka duvarda içeri açılır. İki termometre aynı ölçektedir (0 °C ile 50 °C arası, 10 °C'ta bir çentik): biri tavana, biri tabana yakındır. Elektrikli ısıtıcının rezistansları koruma telinin arkasındadır.</span></figcaption></figure></main><script type="module">// Ş4 kesit oda: gövdeyi kurar ve figürü bir duruma getirir.
// Sayfa (build.mjs içindeki canlı kod) ve ders modülü (fizik/enerji/dersler/oda-sekil.js) aynı kodu kullanır.
// Kit gerekmez: bütün sayılar derlemede hesaplanıp D içine yazılmıştır. Zamanlayıcı yoktur; her şey ayar çağrısıyla değişir.

// Pencere kanadı: menteşesi etrafında dönen ince kutu. Ekran ötelemesiyle döndürülemez, bu yüzden her açıklıkta yeniden
// çizilir (derleme de denetim için aynı işlevi kullanır). K: D.kanat; pay: 0 (kapalı) … 1 (tam açık).
function kanatSvg(K, pay) {
  const a = Math.min(1, Math.max(0, pay)) * K.acik, c = Math.cos(a), s = Math.sin(a), C = K.kam;
  const pr = (x, y, z) => [C.o[0] + x * C.ex[0] + y * C.ey[0], C.o[1] + x * C.ex[1] + y * C.ey[1] + z * C.uz];
  const yol = (pts) => 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
  const boy = [c, s], ic = [-s, c], dis = [s, -c];            // kanat boyunca, iç yüzün ve dış yüzün normali
  const gor = (n) => n[0] * C.cosA + n[1] * C.sinA > 1e-6;
  const ton = (n) => Math.min(3, Math.max(0, Math.floor((n[1] * C.cosA - n[0] * C.sinA + 1) * 2)));
  // u: menteşeden uzaklık, v: iç yüzden dışa doğru derinlik
  const pt = (u, v, z) => pr(K.p[0] + boy[0] * u + dis[0] * v, K.p[1] + boy[1] * u + dis[1] * v, z);
  function kutu(u0, u1, v0, v1, z0, z1, cam) {
    const yuz = (v, uA, uB, zA, zB) => yol([pt(uA, v, zA), pt(uB, v, zA), pt(uB, v, zB), pt(uA, v, zB)]);
    const parca = [], cizgi = [];
    let golge = '', dolgu = '', camYolu = '';
    const buyuk = gor(ic) ? [v0, ic] : gor(dis) ? [v1, dis] : null;
    if (buyuk) {
      let d = yuz(buyuk[0], u0, u1, z0, z1);
      if (cam) { camYolu = yuz(buyuk[0], u0 + cam, u1 - cam, z0 + cam, z1 - cam); d += camYolu; }
      dolgu += '<path class="iso-fill" fill-rule="evenodd" d="' + d + '"/>';
      golge += '<path class="iso-shade" data-shade="' + ton(buyuk[1]) + '" fill-rule="evenodd" d="' + d + '"/>';
      cizgi.push(d);
    }
    const uc = gor(boy) ? [u1, boy] : [u0, [-boy[0], -boy[1]]];
    const ucYolu = yol([pt(uc[0], v0, z0), pt(uc[0], v1, z0), pt(uc[0], v1, z1), pt(uc[0], v0, z1)]);
    const ust = yol([pt(u0, v0, z1), pt(u1, v0, z1), pt(u1, v1, z1), pt(u0, v1, z1)]);
    dolgu += '<path class="iso-fill" d="' + ucYolu + ust + '"/>';
    golge += '<path class="iso-shade" data-shade="' + ton(uc[1]) + '" d="' + ucYolu + '"/><path class="iso-top" d="' + ust + '"/>';
    cizgi.push(ucYolu, ust);
    parca.push(dolgu, golge);
    if (camYolu) parca.push('<path class="od-cam" d="' + camYolu + '"/>');
    parca.push('<path class="iso-line iso-edge" data-tone="hi" d="' + cizgi.join('') + '"/>');
    return '<g class="iso-solid">' + parca.join('') + '</g>';
  }
  const govde = kutu(0, K.w, 0, K.t, K.z0, K.z1, K.cam);
  // Kol iç yüzdedir: iç yüz görünmüyorsa kanadın arkasında kalır, çizilmez.
  const zo = (K.z0 + K.z1) / 2;
  const kol = gor(ic) ? kutu(K.w - K.kol[0] - K.kol[1], K.w - K.kol[0], -K.kol[2], 0, zo - K.kol[3], zo + K.kol[3], 0) : '';
  return govde + kol;
}

// Peteğin dilimleri özdeştir: ilki bir kez çizilir, ötekiler ekranda ötelenmiş kopyalarıdır.
function govdeOf(D) {
  const on = D.on.replace(/§(\d+)§/g, (m, i) => '<g transform="translate(' + (D.kayma[0] * i).toFixed(2) + ' ' + (D.kayma[1] * i).toFixed(2) + ')">' + D.dilim + '</g>');
  return D.arka + '<g data-part="hava">' + D.hava + '</g><g data-part="termolar">' + D.termo + '</g>'
    + D.pencere.replace('§K§', '<g data-part="kanat">' + kanatSvg(D.kanat, D.ilk.pencere) + '</g>') + on;
}

function cizimKur(kok, D) {
  const sinir = (v, a, b) => Math.min(b, Math.max(a, v));
  const yaz = (el, ad, deger) => { if (el && el.getAttribute(ad) !== deger) el.setAttribute(ad, deger); };
  const ALAN = ['soba', 'petek', 'isitici', 'pencere', 'tavan', 'taban', 'hava', 'termometre'];
  const durum = Object.assign({}, D.ilk);
  const tek = (p) => kok.querySelector('[data-part="' + p + '"]');
  const isi = {};
  for (const ad of ['soba', 'petek', 'isitici']) isi[ad] = Array.from(kok.querySelectorAll('[data-isi="' + ad + '"]'));
  const hava = tek('hava'), termolar = tek('termolar'), kanat = tek('kanat');
  const sutun = {};
  for (const ad of ['tavan', 'taban']) sutun[ad] = kok.querySelector('[data-name="' + ad + '.termometre"] [data-part="sutun"]');
  let sonKanat = D.ilk.pencere;
  const sutunKaymasi = (ad) => (sinir(durum[ad], D.term.min, D.term.max) - D.term.max) * D.term.birim * D.uz;

  function uygula() {
    // Isı kaynakları: kızgın yüzeyin turuncu kopyası tabanın üstünde durur; ayar saydamlığıdır.
    for (const ad in isi) {
      const v = sinir(durum[ad], 0, 1) * D.isi[ad];
      for (const el of isi[ad]) { el.style.opacity = v.toFixed(3); el.style.display = v > 0.004 ? '' : 'none'; }
    }
    const h = sinir(durum.hava, 0, 1);
    hava.style.opacity = h.toFixed(3); hava.style.display = h > 0.004 ? '' : 'none';
    const t = sinir(durum.termometre, 0, 1);
    termolar.style.opacity = t >= 1 ? '' : t.toFixed(3); termolar.style.display = t > 0.004 ? '' : 'none';
    for (const ad in sutun) yaz(sutun[ad], 'transform', 'translate(0 ' + sutunKaymasi(ad).toFixed(2) + ')');
    const p = sinir(durum.pencere, 0, 1);
    if (p !== sonKanat) { kanat.innerHTML = kanatSvg(D.kanat, p); sonKanat = p; }
  }
  function ayar(o) {
    if (o) for (const alan of ALAN) if (o[alan] !== undefined && isFinite(o[alan])) durum[alan] = +o[alan];
    uygula();
  }
  const durumOku = () => Object.assign({}, durum);

  // Figür birimiyle, o anki duruma göre. 'yol.<ad>.<i>' bir yolun i. noktasıdır (f.yol bunu kullanır).
  function yer(ad) {
    ad = String(ad);
    if (ad.indexOf('yol.') === 0) {
      const b = ad.split('.'), y = D.yol[b[1]];
      if (!y || !y[+b[2]]) throw new Error('ODA: bilinmeyen yol noktası: ' + ad);
      return y[+b[2]].slice();
    }
    const p = D.nokta[ad];
    if (!p) throw new Error('ODA: bilinmeyen nokta: ' + ad);
    if (ad === 'tavan.termometre' || ad === 'taban.termometre') return [p[0], p[1] + sutunKaymasi(ad.split('.')[0])];
    return p.slice();
  }
  // Tahta birimiyle nokta dizisi; kadrajı izler. f.yol(ad) diye çağrılır (f'ye bağlıdır).
  function yol(ad) {
    const y = D.yol[ad];
    if (!y) throw new Error('ODA: bilinmeyen yol: ' + ad);
    const f = this;
    return y.map((_, i) => f.nokta('yol.' + ad + '.' + i));
  }

  uygula();
  return { arayuz: { ayar, yol, durum: durumOku }, yer };
}

{
  const D = {"arka":"","pencere":"","hava":"","termo":"","on":"","dilim":"","kayma":[-9.552,5.749],"kanat":{"p":[110,2.8],"w":85.7,"t":2.4,"z0":90.3,"z1":175.7,"cam":6,"acik":1.43116998663535,"kol":[3.4,3,2.4,6],"kam":{"o":[370.9,243.57],"ex":[0.9552317135800763,0.5748727958237794],"ey":[-0.9552317135800763,0.5748727958237794],"uz":-1.0788780239219875,"sinA":0.7071067811865475,"cosA":0.7071067811865476}},"uz":-1.07888,"ilk":{"soba":0,"petek":0,"isitici":0,"pencere":0,"tavan":18,"taban":18,"hava":1,"termometre":1},"isi":{"soba":1,"petek":0.5,"isitici":1},"term":{"min":0,"max":50,"birim":1},"nokta":{"soba":[305.94,262.61],"petek":[189.4,328.98],"isitici":[480.75,436.12],"pencere.ust":[517.05,139.49],"pencere.alt":[517.05,236.59],"pencere.dis":[617.39,68.12],"tavan.termometre":[588.69,181.01],"taban.termometre":[588.69,294.29],"el":[369.94,413.26],"tavan":[390,188.76],"taban":[390,404.54]},"yol":{"dongu":[[319.31,257.72],[319.31,237.04],[319.31,216.37],[319.31,195.7],[320.1,175.56],[329.11,163.66],[346.39,168.4],[364.69,179.3],[382.99,190.31],[401.3,201.33],[419.6,212.34],[437.89,223.72],[454.48,241.42],[461.64,270.91],[461.64,298.04],[461.64,325.17],[461.64,352.29],[461.64,379.42],[455.5,401.3],[433.86,397.79],[409.84,383.4],[385.82,368.95],[361.8,354.49],[340.33,330.78]],"petekDongu":[[196.09,295.24],[196.09,268.36],[196.09,241.49],[196.09,214.61],[199.6,190.46],[218.96,188.61],[242.75,202.49],[266.54,216.81],[290.34,231.13],[314.13,245.45],[337.93,259.77],[361.72,274.09],[383.79,295.46],[390.96,330.13],[390.96,362.44],[390.96,394.75],[390.96,427.06],[385.48,454.78],[359.66,449.78],[331.05,432.57],[302.45,415.35],[273.84,398.13],[245.23,380.92],[217.1,368.3]],"pencereUst":[[430.12,206.64],[450.68,186.53],[471.23,166.42],[492.72,151.7],[514.28,137.45],[535.11,118.15],[555.93,98.85],[576.75,79.55]],"pencereAlt":[[614.96,169.44],[593.08,186.87],[571.2,204.31],[549.31,221.68],[527.11,235.25],[505.99,253.75],[487.16,278.37],[468.33,303]],"isima":[[480.75,436.12],[369.94,413.26]]}};
  const sahne = document.querySelector(".ip-stage");
  const gosterge = document.querySelector("[data-readout]");
  const f = cizimKur(sahne.querySelector("svg"), D).arayuz;
  const tr = (v, n = 0) => v.toFixed(n).replace(".", ",");
  const yaz = () => {

    gosterge.textContent = d.termometre > 0.5 ? "tavan " + tr(d.tavan) + " °C · taban " + tr(d.taban) + " °C" : "havasız oda";
  };
  const BOS = { soba: 0, petek: 0, isitici: 0, pencere: 0, tavan: 18, taban: 18, hava: 1, termometre: 1 };
  const POZ = {

    soba: () => f.ayar({ ...BOS, soba: 1, tavan: 40, taban: 22 }),
    petek: () => f.ayar({ ...BOS, petek: 1, tavan: 32, taban: 26 }),
    pencere: () => f.ayar({ ...BOS, petek: 1, pencere: 1, tavan: 32, taban: 26 }),
    yari: () => f.ayar({ ...BOS, pencere: 0.5 }),
    isitici: () => f.ayar({ ...BOS, isitici: 1 }),
    havasiz: () => f.ayar({ ...BOS, isitici: 1, hava: 0, termometre: 0 }),
    sicak: () => f.ayar({ ...BOS, soba: 1, petek: 1, isitici: 1, tavan: 50, taban: 0 }),
  };
  window.oda = f; // denetim betikleri için
  window.pozla = (ad) => { tur = false; (POZ[ad] || POZ.kapali)(); yaz(); return gosterge.textContent; };
  const kip = location.hash.slice(1);
  let tur = !kip && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!tur) (POZ[kip] || POZ.soba)();
  yaz();

  // Tur: soba yanar, tavan termometresi tabandakinden çok yükselir → petek → pencere açılır → hava boşalır, ısıtıcı çalışır. Her adım 6 sn.
  const yum = (t) => t * t * (3 - 2 * t);
  const ara = (a, b, t) => a + (b - a) * t;
  const ADIM = [
    (t) => f.ayar({ ...BOS, soba: Math.min(1, t * 4), tavan: ara(18, 40, t), taban: ara(18, 22, t) }),
    (t) => f.ayar({ ...BOS, petek: Math.min(1, t * 4), tavan: ara(18, 32, t), taban: ara(18, 26, t) }),
    (t) => f.ayar({ ...BOS, petek: 1, pencere: t, tavan: ara(32, 26, t), taban: ara(26, 16, t) }),
    (t) => f.ayar({ ...BOS, isitici: t > 0.5 ? 1 : 0, hava: 1 - Math.min(1, t * 2.5), termometre: 1 - Math.min(1, t * 2.5) }),
  ];
  const SURE = 6000;
  let basla = null, gorunur = true;
  new IntersectionObserver(([e]) => { gorunur = e.isIntersecting; }).observe(sahne);
  const kare = (an) => {
    if (!tur) return;
    if (basla === null) basla = an;
    if (gorunur) {
      const gecen = (an - basla) / SURE, i = Math.floor(gecen) % ADIM.length, t = gecen - Math.floor(gecen);
      ADIM[i](yum(Math.min(1, t / 0.8)));
      yaz();
    }
    requestAnimationFrame(kare);
  };
  if (tur) requestAnimationFrame(kare);
}
