.iso{

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

 144.4L526.4 144.2L526.4 139.8L529.1 140ZM526.4 144.2L524.1 143.5L524.1 139.2L526.4 139.8Z"/><path class="iso-shade" data-shade="3" d="M524.1 143.5L522.2 142.6L522.2 138.3L524.1 139.2ZM522.2 142.6L521 141.4L521 137.1L522.2 138.3ZM521 141.4L520.5 140.1L520.5 135.8L521 137.1Z"/><path class="iso-top" d="M537.1 137.1L535.9 138.3L534.1 139.2L531.7 139.8L529.1 140L526.4 139.8L524.1 139.2L522.2 138.3L521 137.1L520.5 135.8L521 134.5L522.2 133.3L524.1 132.3L526.4 131.7L529.1 131.5L531.7 131.7L534.1 132.3L535.9 133.3L537.1 134.5L537.6 135.8Z"/><path class="iso-line iso-crease" data-tone="faint" d="M537.6 135.8L537.1 137.1L535.9 138.3L534.1 139.2L531.7 139.8L529.1 140L526.4 139.8L524.1 139.2L522.2 138.3L521 137.1L520.5 135.8"/><path class="iso-line iso-bevel" data-tone="faint" d="M537.6 135.8L536.4 137L535.3 138.1L533.6 138.9L531.5 139.5L529.1 139.7L526.7 139.5L524.5 138.9L522.8 138.1L521.7 137L520.5 135.8"/><path class="iso-line iso-edge" data-tone="mid" d="M520.5 135.8L521 134.5L522.2 133.3L524.1 132.3L526.4 131.7L529.1 131.5L531.7 131.7L534.1 132.3L535.9 133.3L537.1 134.5L537.6 135.8M537.6 140.1L537.1 141.4L535.9 142.6L534.1 143.5L531.7 144.2L529.1 144.4L526.4 144.2L524.1 143.5L522.2 142.6L521 141.4L520.5 140.1M520.5 135.8L520.5 140.1M537.6 135.8L537.6 140.1"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Termometre sütunu: boyu sıcaklıkla doğru orantılı</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Kesit: iç sıva, delikli tuğla, dış sıva, yalıtım levhası</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Pencere kesiti: kasa, cam, çift camda ara boşluk çıtası</span></span><span class="iso-caption">Kesit yüzü izleyiciye dönüktür: katmanlar soldan sağa iç sıva, tuğla, dış sıva ve yalıtım levhasıdır. Levha raylarda kayar; çıkarılınca dört levha kalınlığı ötede durur. İki termometrenin ölçeği aynıdır (−10 °C ile 50 °C arası, 10 °C'ta bir çentik) ve ikisi ekranda aynı hizadadır: sütunların tepeleri yatay bir çizgiyle karşılaştırılır.</span></figcaption></figure></main><script type="module">// Ş6 duvar kesiti: gövdeyi kurar ve figürü bir duruma getirir.
// Sayfa (build.mjs içindeki canlı kod) ve ders modülü (fizik/enerji/dersler/duvar-sekil.js) aynı kodu kullanır.
// Kit gerekmez: bütün sayılar derlemede hesaplanıp D içine yazılmıştır. Zamanlayıcı yoktur; her şey ayar çağrısıyla değişir.

// Yalıtım levhası tek gruptur: duvardaki yerinde çizilmiştir, çıkarılınca ekranda D.kayma kadar ötelenir
// (izometrik izdüşümde dünya ötelemesi ekran ötelemesidir).
function govdeOf(D) {
  return D.arka + D.duvar + '<g data-part="levha">' + D.levha + '</g>' + D.on;
}

function cizimKur(kok, D) {
  const sinir = (v, a, b) => Math.min(b, Math.max(a, v));
  const yaz = (el, ad, deger) => { if (el && el.getAttribute(ad) !== deger) el.setAttribute(ad, deger); };
  const sutun = (ad) => kok.querySelector('[data-name="' + ad + '.termometre"] [data-part="sutun"]');
  const el = {
    levha: kok.querySelector('[data-part="levha"]'),
    cift: Array.from(kok.querySelectorAll('[data-grup="cift"]')),
    ic: sutun('ic'),
    dis: sutun('dis'),
  };
  const durum = Object.assign({}, D.ilk);
  const derece = (v) => sinir(v, D.term.min, D.term.max);
  // Levhanın duvardan uzaklığı (0 takılı, 1 çıkarılmış) ve dış yüzün levhaya geçme payı (son çeyrekte 0 → 1).
  const uzak = () => 1 - sinir(durum.yalitim, 0, 1);
  const kapli = () => sinir((sinir(durum.yalitim, 0, 1) - 0.75) * 4, 0, 1);

  function uygula() {
    const u = uzak();
    yaz(el.levha, 'transform', 'translate(' + (D.kayma[0] * u).toFixed(2) + ' ' + (D.kayma[1] * u).toFixed(2) + ')');
    const cift = durum.cam >= 1.5;
    for (const parca of el.cift) parca.style.display = cift ? '' : 'none';
    for (const ad of ['ic', 'dis']) yaz(el[ad], 'transform', 'translate(0 ' + ((derece(durum[ad]) - D.term.max) * D.term.birim * D.uz).toFixed(2) + ')');
  }

  function ayar(o) {
    if (o) for (const alan of ['yalitim', 'cam', 'ic', 'dis']) if (o[alan] !== undefined && isFinite(o[alan])) durum[alan] = +o[alan];
    uygula();
  }

  // Figür birimiyle, o anki duruma göre.
  function yer(ad) {
    const N = D.nokta;
    if (ad === 'ic.termometre' || ad === 'dis.termometre') {
      const p = N[ad];
      return [p[0], p[1] + (derece(durum[ad.slice(0, ad.indexOf('.'))]) - D.term.max) * D.term.birim * D.uz];
    }
    if (ad === 'duvar.dis' || ad === 'kalinlik.b') { const k = kapli(); return [N[ad][0] + D.kalin[0] * k, N[ad][1] + D.kalin[1] * k]; }
    if (ad === 'yalitim') { const u = uzak(); return [N.yalitim[0] + D.kayma[0] * u, N.yalitim[1] + D.kayma[1] * u]; }
    if (ad === 'cam') return (durum.cam >= 1.5 ? N.cam2 : N.cam1).slice();
    if (ad === 'duvar.ic' || ad === 'kalinlik.a') return N[ad].slice();
    if (ad === 'ic.etiket' || ad === 'dis.etiket') {
      // Tabanın ön kenarının altı; iki nokta aynı y'dedir (iki yazı tek satıra düşer). Kadraj tabanı kesiyorsa kadrajın
      // alt kenarı: yazı her kadrajda figürün hemen altında kalır.
      const kutu = (kok.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
      const alt = kutu.length === 4 && isFinite(kutu[3]) ? kutu[1] + kutu[3] : Infinity;
      return [N[ad][0], Math.min(Math.max(N['ic.etiket'][1], N['dis.etiket'][1]), alt)];
    }
    throw new Error('DUVAR: bilinmeyen nokta: ' + ad);
  }

  uygula();
  return { arayuz: { ayar, durum: () => Object.assign({}, durum) }, yer };
}

// Tek başına sayfanın canlı kodu: küçük bir gösteri turu (yalnızca bu sayfada; ders modülünde döngü yoktur).
// Adres çubuğundaki # ile tur durur ve bir dinlenme pozu kurulur: #takili #cikmis #ara #cift #cift-cikmis #kis #yaz #uc
{
  const D = {"arka":"","duvar":"","levha":"","on":"","uz":-2.16647,"ilk":{"yalitim":1,"cam":1,"ic":20,"dis":20},"term":{"min":-10,"max":50,"birim":1.8},"kayma":[133.23,21.65],"kalin":[36.64,5.95],"nokta":{"ic.termometre":[87.31,131.99],"dis.termometre":[572.35,131.99],"duvar.ic":[158.26,343.1],"duvar.dis":[272.46,361.65],"yalitim":[290.78,284.9],"cam1":[226.54,211.2],"cam2":[215.36,209.39],"kalinlik.a":[158.26,96.12],"kalinlik.b":[272.46,114.67],"ic.etiket":[74.87,511.92],"dis.etiket":[350.14,556.64]}};
  const sahne = document.querySelector(".ip-stage");
  const gosterge = document.querySelector("[data-readout]");
  const f = cizimKur(sahne.querySelector("svg"), D).arayuz;
  const tr = (v) => String(Math.round(v)).replace("-", "−");
  const yaz = () => {
    const d = f.durum();
    gosterge.textContent = "iç " + tr(d.ic) + " °C · dış " + tr(d.dis) + " °C · yalıtım " + (d.yalitim > 0.99 ? "takılı" : d.yalitim < 0.01 ? "çıkarılmış" : "yolda") + " · " + (d.cam >= 1.5 ? "çift cam" : "tek cam");
  };
  const POZ = {
    takili: { yalitim: 1, cam: 1, ic: 20, dis: 20 },
    cikmis: { yalitim: 0, cam: 1, ic: 22, dis: 0 },
    ara: { yalitim: 0.5, cam: 1, ic: 22, dis: 0 },
    cift: { yalitim: 1, cam: 2, ic: 19, dis: 0 },
    "cift-cikmis": { yalitim: 0, cam: 2, ic: 19, dis: 0 },
    kis: { yalitim: 1, cam: 1, ic: 17, dis: 0 },
    yaz: { yalitim: 0, cam: 1, ic: 33, dis: 38 },
    uc: { yalitim: 1, cam: 2, ic: -10, dis: 50 },
  };
  window.duvar = f; // denetim betikleri için
  window.pozla = (ad) => { tur = false; f.ayar(POZ[ad] || POZ.takili); yaz(); return gosterge.textContent; };
  const kip = location.hash.slice(1);
  let tur = !kip && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!tur) f.ayar(POZ[kip] || POZ.kis);
  yaz();

  // Tur: kış gecesi yalıtımsız (iç 22 → 9) → levha takılır → aynı gece (22 → 17) → yaz, levha çıkar (25 → 33) → çift cam. Her adım 5 sn.
  const yum = (t) => t * t * (3 - 2 * t);
  const ara = (a, b, t) => a + (b - a) * t;
  const ADIM = [
    (t) => f.ayar({ yalitim: 0, cam: 1, dis: 0, ic: ara(22, 9, t) }),
    (t) => f.ayar({ yalitim: yum(Math.min(1, t * 2)), cam: 1, dis: 0, ic: ara(9, 22, Math.min(1, t * 2)) }),
    (t) => f.ayar({ yalitim: 1, cam: 1, dis: 0, ic: ara(22, 17, t) }),
    (t) => f.ayar({ yalitim: 1 - yum(Math.min(1, t * 2)), cam: 1, dis: ara(0, 38, Math.min(1, t * 2)), ic: ara(17, 25, Math.min(1, t * 2)) }),
    (t) => f.ayar({ yalitim: 0, cam: 1, dis: 38, ic: ara(25, 33, t) }),
    (t) => f.ayar({ yalitim: yum(Math.min(1, t * 2)), cam: t > 0.5 ? 2 : 1, dis: ara(38, 0, Math.min(1, t * 2)), ic: ara(33, 22, Math.min(1, t * 2)) }),
    (t) => f.ayar({ yalitim: 1, cam: 2, dis: 0, ic: ara(22, 19, t) }),
  ];
  const SURE = 5000;
  let basla = null, gorunur = true;
  new IntersectionObserver(([e]) => { gorunur = e.isIntersecting; }).observe(sahne);
  const kare = (an) => {
    if (!tur) return;
    if (basla === null) basla = an;
    if (gorunur) {
      const gecen = (an - basla) / SURE, i = Math.floor(gecen) % ADIM.length, t = gecen - Math.floor(gecen);
      ADIM[i](Math.min(1, t / 0.8));
      yaz();
    }
    requestAnimationFrame(kare);
  };
  if (tur) requestAnimationFrame(kare);
}
